<style>
:root{
  color-scheme:light;
  --paper:#efe6d1; --paper-hi:#f7f1e3; --paper-lo:#e3d7bd; --desk:#d8ccb1;
  --ink:#1b1b1d; --ink-2:#48474a; --ink-3:#8b877e;
  --cinnabar:#b3261e; --cinnabar-lo:rgba(179,38,30,.12);
  --azurite:#1e5b73; --malachite:#4c8a67; --ochre:#b3854f;
  --silk:#c5cdc5; --silk-dark:#8e9a92;
  --brush:'QJ Brush','Ma Shan Zheng','STKaiti','KaiTi','Kaiti SC',serif;
  --serif:'Noto Serif SC','Songti SC','STSong','SimSun',serif;
}
[hidden]{display:none!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;background:var(--desk);color:var(--ink);font-family:var(--serif)}
button{font-family:var(--serif);color:inherit}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--cinnabar);outline-offset:2px}
#app{position:fixed;inset:0;overflow:hidden;background:var(--desk)}

/* ---------- 长卷 ---------- */
#scroll{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);height:calc(900px * var(--s));

      <div class="intro"><q>运筹帷幄之中，决胜千里之外</q>——《史记·高祖本纪》<br>「运筹学」这个中文译名，正出自这一句。</div>
      <div class="rod"><div class="label">千里江山 · 运筹录</div></div>
      <button class="btn red" id="openBtn" style="font-size:16px;padding:10px 28px;letter-spacing:.4em">展 卷</button>
    </div>
  </div>

  <div class="modal" id="leafModal" hidden>
    <div class="leaf" role="dialog" aria-modal="true" aria-labelledby="leafName">
      <div class="in">
        <div class="vt"><div class="n" id="leafName"></div><div class="c" id="leafConcept"></div></div>
        <dl>
          <div><dt>故 事</dt><dd id="leafStory"></dd></div>
          <div><dt>玩 法</dt><dd id="leafPlay"></dd></div>
          <div><dt>顿 悟</dt><dd class="aha" id="leafAha"></dd></div>
        </dl>
        <div class="acts" id="leafActs"></div>
      </div>
      <button class="x" id="leafX" aria-label="合上">✕</button>
    </div>
  </div>

  <div id="level" hidden>
    <div class="bar">
      <div class="ttl"><b id="lvName"></b><span id="lvStageName"></span></div>
      <div id="lvMeter"></div>
      <button class="btn" id="lvClose">回长卷</button>
    </div>
    <div id="lvMain">
      <div id="lvStage"></div>
      <div id="result" hidden>
        <div class="grade" id="rGrade"></div>
        <div class="nums" id="rNums"></div>
        <div class="line" id="rLine"></div>
      </div>
    </div>
    <div class="foot">
      <div class="say" id="say" aria-live="polite"></div>
      <div class="acts" id="acts"></div>
    </div>
  </div>

  <div id="colo" hidden>
    <div class="sheet"><div class="page">
      <div class="v" id="coloV"></div>
      <button class="btn red" id="coloBack">钤印 · 回到长卷</button>
    </div></div>
  </div>
</div>
<script>
(()=>{"use strict";

/* ---- core/audio.js ---- */


const PENTA=[0,2,4,7,9];
const KEY_HZ=146.83;                                   // D3
function degHz(deg){const o=Math.floor(deg/5),d=((deg%5)+5)%5;return KEY_HZ*Math.pow(2,(PENTA[d]+12*o)/12);}
const cls=d=>((d%5)+5)%5;

const TEMPO=64, BEAT=60/TEMPO, BAR=BEAT*4;

const PROGS=[[0,-1,1,3],[0,3,-1,2],[-1,1,3,0],[0,2,3,0],[-2,0,1,3],[3,1,-1,0]];

const MOTIFS=[
  [[8,1.5],[9,.5],[10,1],[9,.5],[8,.5],[7,2],[8,2]],
  [[10,1],[11,1],[12,1.5],[11,.5],[10,2],[9,2]],
  [[9,.5],[10,.5],[9,1],[8,1],[7,1],[6,2],[5,2]],
  [[5,1],[7,1],[8,2],[9,1],[8,.5],[7,.5],[8,2]],
  [[12,2],[11,1],[10,1],[9,1.5],[10,.5],[8,2]],
  [[8,1],[7,.5],[6,.5],[7,1],[6,1],[5,4]],
  [[7,1],[8,1],[10,1.5],[9,.5],[8,1],[7,1],[6,2]],
  [[10,1.5],[12,.5],[11,1],[10,1],[9,2],[10,2]],
  [[6,1],[5,.5],[6,.5],[7,1],[8,1],[9,1],[8,1],[7,2]]
];

const ARPS={
  flow:[[0,3,5,7,8,7,5,3],[0,3,5,3,0,3,5,8]],
  wave:[[0,5,3,5,7,5,8,5],[0,5,3,5,7,8,7,5]],
  sparse:[[0,null,5,null,3,null,7,null],[0,null,3,null,5,null,null,null]],
  still:[[0,null,null,null,5,null,null,null],[3,null,null,null,null,null,null,null]]
};

const SECTION_TYPES={
  intro:    {pad:1,bass:1,arp:'still',melody:0,harm:1,bell:1},
  A:        {pad:1,bass:1,arp:'flow',melody:1,bell:1},
  B:        {pad:1,bass:1,arp:'wave',melody:1,high:1,gliss:1,bell:1},
  A2:       {pad:1,bass:1,arp:'flow',melody:1},
  interlude:{pad:1,bass:1,arp:'sparse',melody:0,zheng:1,harm:1},
  calm:     {pad:.7,bass:.8,arp:'sparse',melody:0,harm:1,quiet:1},      // 关卡里：安静、不抢注意力
  calm2:    {pad:.7,bass:.8,arp:'still',melody:0,zheng:1,quiet:1}
};
const FORM={scroll:['intro','A','B','A2','interlude','A','B','interlude'],level:['calm','calm2']};

function createAudio(){
  let ac=null,out=null,musicBus=null,sfxBus=null,verbIn=null,noiseBuf=null,xiaoWave=null;
  let on=false,mood='scroll',timer=0,nextBar=0,barIdx=0,secIdx=0,prog=PROGS[0],lastMotif=-1,live=[];
  const cache=new Map();
  let rnd=Math.random;

  function build(ctx){
    ac=ctx;
    const comp=ac.createDynamicsCompressor();comp.threshold.value=-18;comp.knee.value=10;comp.ratio.value=3;comp.attack.value=.008;comp.release.value=.25;
    out=ac.createGain();out.gain.value=.95;comp.connect(out);out.connect(ac.destination);
    const lp=ac.createBiquadFilter();lp.type='lowpass';lp.frequency.value=6000;
    const dry=ac.createGain();dry.gain.value=1;lp.connect(dry);dry.connect(comp);
    const verb=ac.createConvolver();verb.buffer=makeIR(3.6);const wet=ac.createGain();wet.gain.value=.36;verb.connect(wet);wet.connect(comp);
    verbIn=ac.createGain();verbIn.gain.value=1;lp.connect(verbIn);verbIn.connect(verb);
    musicBus=ac.createGain();musicBus.gain.value=0;musicBus.connect(lp);
    sfxBus=ac.createGain();sfxBus.gain.value=.9;sfxBus.connect(lp);
    noiseBuf=ac.createBuffer(1,ac.sampleRate*2,ac.sampleRate);const nd=noiseBuf.getChannelData(0);for(let i=0;i<nd.length;i++)nd[i]=Math.random()*2-1;
    const H=[0,1,.34,.12,.07,.035,.02];xiaoWave=ac.createPeriodicWave(new Float32Array(H.length),new Float32Array(H),{disableNormalization:false});
  }
  function makeIR(sec){
    const sr=ac.sampleRate,len=Math.floor(sr*sec),b=ac.createBuffer(2,len,sr);
    for(let ch=0;ch<2;ch++){const d=b.getChannelData(ch);let l=0;
      for(let i=0;i<len;i++){const t=i/len,k=.55-.5*t;l+=((Math.random()*2-1)-l)*k;d[i]=l*Math.pow(1-t,2.4)*(i<sr*.015?i/(sr*.015):1)*1.6;}}
    return b;
  }
  function track(node,end){live.push({node,end});if(live.length>400)live=live.filter(x=>x.end>ac.currentTime);}

  
  function ksBuf(f,dur,bright){
    const key=Math.round(f)+'|'+dur+'|'+bright;if(cache.has(key))return cache.get(key);
    const sr=ac.sampleRate,N=Math.max(2,Math.round(sr/f)),len=Math.round(sr*dur),buf=ac.createBuffer(1,len,sr),d=buf.getChannelData(0);
    const ring=new Float32Array(N);let prev=0;for(let i=0;i<N;i++){prev+=((Math.random()*2-1)-prev)*bright;ring[i]=prev;}
    let mean=0;for(let i=0;i<N;i++)mean+=ring[i];mean/=N;for(let i=0;i<N;i++)ring[i]-=mean;
    const decay=Math.pow(.001,1/(dur*f));let idx=0,peak=1e-6;
    for(let i=0;i<len;i++){const a=ring[idx],b=ring[(idx+1)%N];d[i]=a;ring[idx]=(a+b)*.5*decay;idx=(idx+1)%N;const v=Math.abs(a);if(v>peak)peak=v;}
    const fade=Math.round(len*.06);for(let i=0;i<len;i++){d[i]/=peak;if(i>len-fade)d[i]*=(len-i)/fade;}
    const res={buf,fa:sr/(N+.5)};cache.set(key,res);return res;
  }
  function pluck(when,f,vel,o){
    o=o||{};const dur=o.dur||(f<200?4.2:f<500?3.2:2.2),k=ksBuf(f,dur,o.bright||.62);
    const s=ac.createBufferSource();s.buffer=k.buf;const rate=f/k.fa;s.playbackRate.setValueAtTime(rate,when);
    if(o.bend){s.playbackRate.setValueAtTime(rate,when+(o.bendAt||.18));s.playbackRate.linearRampToValueAtTime(rate*o.bend,when+(o.bendAt||.18)+.22);}
    const g=ac.createGain();g.gain.value=vel;
    let node=g;if(ac.createStereoPanner&&o.pan){const p=ac.createStereoPanner();p.pan.value=o.pan;g.connect(p);node=p;}
    s.connect(g);node.connect(o.bus||musicBus);s.start(when);s.stop(when+dur);track(s,when+dur);
  }
  function harmonic(when,f,vel,bus){ // 泛音：近乎纯音，短促
    const o=ac.createOscillator();o.type='sine';o.frequency.value=f;const g=ac.createGain();
    g.gain.setValueAtTime(0,when);g.gain.linearRampToValueAtTime(vel,when+.006);g.gain.exponentialRampToValueAtTime(.0001,when+1.6);
    const o2=ac.createOscillator();o2.type='sine';o2.frequency.value=f*2;const g2=ac.createGain();g2.gain.setValueAtTime(0,when);g2.gain.linearRampToValueAtTime(vel*.25,when+.004);g2.gain.exponentialRampToValueAtTime(.0001,when+.6);
    o.connect(g);o2.connect(g2);g.connect(bus||musicBus);g2.connect(bus||musicBus);o.start(when);o2.start(when);o.stop(when+1.7);o2.stop(when+.7);track(o,when+1.7);track(o2,when+.7);
  }
  function bell(when,f,vel,bus){ // 碰铃：非谐泛音
    [[1,1,2.6],[2.76,.45,1.3],[5.4,.22,.6],[8.93,.1,.3]].forEach(([m,a,dk])=>{const o=ac.createOscillator();o.type='sine';o.frequency.value=f*m;const g=ac.createGain();
      g.gain.setValueAtTime(0,when);g.gain.linearRampToValueAtTime(vel*a,when+.004);g.gain.exponentialRampToValueAtTime(.0001,when+dk);o.connect(g);g.connect(bus||musicBus);o.start(when);o.stop(when+dk+.05);track(o,when+dk);});
  }
  function pad(when,freqs,dur,vel){ // 笙：锯齿 + 三角，低通，缓起缓收
    const f=ac.createBiquadFilter();f.type='lowpass';f.frequency.value=820;f.Q.value=.4;
    const g=ac.createGain();g.gain.setValueAtTime(0,when);g.gain.linearRampToValueAtTime(vel,when+1.6);g.gain.setValueAtTime(vel,when+dur-2.2);g.gain.linearRampToValueAtTime(0,when+dur);
    const lfo=ac.createOscillator();lfo.frequency.value=.13;const lg=ac.createGain();lg.gain.value=180;lfo.connect(lg);lg.connect(f.frequency);lfo.start(when);lfo.stop(when+dur);
    freqs.forEach((fr,i)=>{[-5,5].forEach((ct,j)=>{const o=ac.createOscillator();o.type=j?'triangle':'sawtooth';o.frequency.value=fr*Math.pow(2,ct/1200);const og=ac.createGain();og.gain.value=j?1:.45;o.connect(og);og.connect(f);o.start(when);o.stop(when+dur+.1);track(o,when+dur);});});
    f.connect(g);g.connect(musicBus);
  }
  function xiao(when,notes,vel){ // 箫：一句一口气，连音滑过去，长音加揉
    const o=ac.createOscillator();o.setPeriodicWave(xiaoWave);
    const env=ac.createGain();env.gain.value=0;
    const lp=ac.createBiquadFilter();lp.type='lowpass';lp.frequency.value=2600;lp.Q.value=.3;
    const lfo=ac.createOscillator();lfo.frequency.value=5.2;const lg=ac.createGain();lg.gain.value=0;lfo.connect(lg);lg.connect(o.frequency);
    const nz=ac.createBufferSource();nz.buffer=noiseBuf;nz.loop=true;const bp=ac.createBiquadFilter();bp.type='bandpass';bp.Q.value=1.4;const ng=ac.createGain();ng.gain.value=0;
    o.connect(env);nz.connect(bp);bp.connect(ng);ng.connect(env);env.connect(lp);lp.connect(musicBus);
    let tEnd=when;
    notes.forEach((n,i)=>{const t=when+n.t,f=n.f;
      if(i===0){o.frequency.setValueAtTime(f*.985,t);o.frequency.setTargetAtTime(f,t,.05);env.gain.setValueAtTime(0,t);env.gain.linearRampToValueAtTime(vel,t+.14);}
      else{o.frequency.setTargetAtTime(f,t-.015,.022);if(!n.grace){env.gain.setTargetAtTime(vel*.62,t-.03,.012);env.gain.setTargetAtTime(vel*(n.acc||1),t+.012,.045);}}
      bp.frequency.setValueAtTime(f*2.1,t);
      if(!n.grace){ng.gain.setValueAtTime(vel*.42,t);ng.gain.setTargetAtTime(vel*.07,t+.03,.08);}
      if(n.d>=.8&&!n.grace){lg.gain.setValueAtTime(0,t+.05);lg.gain.linearRampToValueAtTime(f*.0065,t+Math.min(.55,n.d*.5));lg.gain.setTargetAtTime(0,t+n.d-.05,.03);
        env.gain.linearRampToValueAtTime(vel*(n.acc||1)*1.07,t+n.d*.55);env.gain.linearRampToValueAtTime(vel*(n.acc||1)*.92,t+n.d-.02);}
      tEnd=Math.max(tEnd,t+n.d);});
    env.gain.setTargetAtTime(0,tEnd-.06,.11);
    o.start(when);lfo.start(when);nz.start(when);o.stop(tEnd+1);lfo.stop(tEnd+1);nz.stop(tEnd+1);track(o,tEnd+1);track(nz,tEnd+1);
  }
  function woodblock(when,vel,bus){const o=ac.createOscillator();o.type='sine';o.frequency.setValueAtTime(900,when);o.frequency.exponentialRampToValueAtTime(520,when+.06);
    const g=ac.createGain();g.gain.setValueAtTime(0,when);g.gain.linearRampToValueAtTime(vel,when+.003);g.gain.exponentialRampToValueAtTime(.0001,when+.12);o.connect(g);g.connect(bus||musicBus);o.start(when);o.stop(when+.15);track(o,when+.15);}

  
  function section(){const f=FORM[mood];return f[secIdx%f.length];}
  function pickMotif(root,cadence){
    const want=cadence?[cls(root)]:[cls(root),cls(root+2),cls(root+3)];
    const cand=[];MOTIFS.forEach((m,i)=>{if(i!==lastMotif&&want.includes(cls(m[m.length-1][0])))cand.push(i);});
    const i=cand.length?cand[Math.floor(rnd()*cand.length)]:Math.floor(rnd()*MOTIFS.length);lastMotif=i;return MOTIFS[i];
  }
  function scheduleBar(t0){
    const S=SECTION_TYPES[section()],chordPos=Math.floor(barIdx/2)%4,barInChord=barIdx%2,root=prog[chordPos];
    const q=S.quiet?.62:1;
    if(barInChord===0){
      const chordDur=BAR*2;
      if(S.pad)pad(t0,[degHz(root),degHz(root+3),degHz(root+5)],chordDur+1.8,.032*S.pad);
      if(S.bass){pluck(t0,degHz(root),.34*S.bass*q,{bright:.32,dur:4.6});pluck(t0,degHz(root-5),.2*S.bass*q,{bright:.25,dur:4.6});}
      if(S.bell&&chordPos===0&&barIdx%8===0)bell(t0+.02,degHz(root+15),.035);
      if(S.melody&&!(chordPos===2&&rnd()<.35)){
        const m=pickMotif(root,chordPos===3);const lift=S.high&&Math.max(...m.map(n=>n[0]))<=10?5:0;
        const notes=[];let t=0;
        m.forEach(([dg,b],i)=>{const d=b*BEAT;
          if(b>=1&&i>0&&rnd()<.28){notes.push({f:degHz(dg+lift+1),t:t,d:.075,grace:1});notes.push({f:degHz(dg+lift),t:t+.075,d:d-.075,acc:i%2?.92:1});}
          else notes.push({f:degHz(dg+lift),t:t,d:d,acc:(i===0||b>=2)?1:.9});t+=d;});
        xiao(t0+.04,notes,.13*q);
      }
      if(S.zheng&&rnd()<.8){ // 间奏：古筝独奏一句，带按音
        const m=pickMotif(root,false);let t=0;m.forEach(([dg,b],i)=>{const d=b*BEAT;pluck(t0+t,degHz(dg),.2*q,{bright:.7,bend:(b>=2&&rnd()<.5)?1.0595:0,bendAt:.35,pan:-.1});t+=d;});
      }
    } else if(S.bass){pluck(t0,degHz(root),.2*S.bass*q,{bright:.3,dur:3.8});}

    const pat=ARPS[S.arp][barInChord];
    if(S.gliss&&barIdx%8===0&&barInChord===0){for(let i=0;i<9;i++)pluck(t0-.36+i*.04,degHz(root+i+2),.07+i*.012,{bright:.75,dur:1.8,pan:.15});}
    pat.forEach((dg,i)=>{if(dg==null)return;const acc=[1,.6,.78,.6,.9,.6,.78,.6][i];const jitter=(rnd()-.5)*.016;
      pluck(t0+i*BEAT/2+jitter,degHz(root+5+dg),(.19*acc+.02*rnd())*q*(S.melody?.85:1),{bright:.66,pan:(i%2?.18:-.18)});});
    if(S.harm&&rnd()<.5)harmonic(t0+BEAT*(2+Math.floor(rnd()*2))+BEAT/2,degHz(root+10+(rnd()<.5?3:5)),.06*q);
    if(section()==='interlude'&&barInChord===1&&rnd()<.4)woodblock(t0+BEAT*3.5,.05);

    barIdx++;
    if(barIdx%8===0){secIdx++;if(section()==='A'||section()==='calm'||rnd()<.35)prog=PROGS[Math.floor(rnd()*PROGS.length)];}
  }
  function tick(){if(!on||!ac)return;while(nextBar<ac.currentTime+1.4){scheduleBar(nextBar);nextBar+=BAR;}}

  function start(){
    if(!ac)return;on=true;clearInterval(timer);live=live.filter(x=>x.end>ac.currentTime);
    if(nextBar<ac.currentTime+.05){nextBar=ac.currentTime+.15;barIdx=4;secIdx=0;prog=PROGS[mood==='scroll'?0:4];}  // 引子只留四小节
    musicBus.gain.cancelScheduledValues(ac.currentTime);musicBus.gain.setValueAtTime(musicBus.gain.value,ac.currentTime);musicBus.gain.linearRampToValueAtTime(.8,ac.currentTime+1.8);
    tick();timer=setInterval(tick,180);
  }
  function stop(){
    if(!ac)return;on=false;clearInterval(timer);const t=ac.currentTime;
    musicBus.gain.cancelScheduledValues(t);musicBus.gain.setValueAtTime(musicBus.gain.value,t);musicBus.gain.linearRampToValueAtTime(0,t+.7);
    live.forEach(x=>{try{x.node.stop(t+.75);}catch(e){}});live=[];nextBar=0;
  }

  return{
    unlock(){if(!ac){const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;build(new AC());}if(ac.state==='suspended')ac.resume();},
    music(v){this.unlock();if(!ac)return false;const want=v==null?!on:v;if(want&&!on)start();else if(!want&&on)stop();return on;},
    isOn:()=>on,
    setMood(m){if(m===mood||!FORM[m])return;mood=m;secIdx=0;barIdx=barIdx-(barIdx%2);  // 下一小节起换编排
      if(ac&&on){const t=ac.currentTime;musicBus.gain.cancelScheduledValues(t);musicBus.gain.setValueAtTime(musicBus.gain.value,t);musicBus.gain.linearRampToValueAtTime(.35,t+.6);musicBus.gain.linearRampToValueAtTime(.8,t+3.5);}},
    
    tap(i,v){if(!ac)return;pluck(ac.currentTime,degHz(5+((i%10)+10)%10),v||.26,{bright:.72,bus:sfxBus});},
    low(){if(!ac)return;pluck(ac.currentTime,degHz(-2),.3,{bright:.3,dur:1.6,bus:sfxBus});},
    rise(){if(!ac)return;const t=ac.currentTime;pluck(t,degHz(8),.24,{bright:.7,bus:sfxBus});pluck(t+.11,degHz(10),.24,{bright:.7,bus:sfxBus});},
    arp(){if(!ac)return;const t=ac.currentTime;[5,7,8,10,12,13].forEach((k,i)=>pluck(t+i*.09,degHz(k),.22,{bright:.72,bus:sfxBus}));bell(t+.55,degHz(15),.06,sfxBus);},
    gliss(){if(!ac)return;const t=ac.currentTime;for(let i=0;i<10;i++)pluck(t+i*.035,degHz(5+i),.08+i*.012,{bright:.78,dur:1.6,bus:sfxBus});},
    bell(){if(!ac)return;bell(ac.currentTime,degHz(15),.07,sfxBus);},
    thud(){if(!ac)return;const t=ac.currentTime,o=ac.createOscillator(),g=ac.createGain();o.frequency.setValueAtTime(120,t);o.frequency.exponentialRampToValueAtTime(48,t+.25);
      g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.7,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+.35);o.connect(g);g.connect(sfxBus);o.start(t);o.stop(t+.4);woodblock(t,.08,sfxBus);},
    paper(){if(!ac)return;const t=ac.currentTime,s=ac.createBufferSource();s.buffer=noiseBuf;const f=ac.createBiquadFilter();f.type='bandpass';f.frequency.value=2200;f.Q.value=.6;const g=ac.createGain();
      g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.05,t+.05);g.gain.exponentialRampToValueAtTime(.0001,t+.35);s.connect(f);f.connect(g);g.connect(sfxBus);s.start(t,Math.random());s.stop(t+.4);},
    
    async renderOffline(seconds,m){
      const oc=new OfflineAudioContext(2,Math.round(44100*seconds),44100);const keep={ac,out,musicBus,sfxBus,verbIn,noiseBuf,xiaoWave,on,mood,nextBar,barIdx,secIdx,prog};
      build(oc);mood=m||'scroll';on=true;nextBar=.1;barIdx=0;secIdx=0;prog=PROGS[0];musicBus.gain.value=.8;
      while(nextBar<seconds)  {scheduleBar(nextBar);nextBar+=BAR;}
      const buf=await oc.startRendering();
      ({ac,out,musicBus,sfxBus,verbIn,noiseBuf,xiaoWave,on,mood,nextBar,barIdx,secIdx,prog}=keep);cache.clear();
      return buf;
    }
  };
}

/* ---- core/rng.js ---- */

function RNG(seed){
  return function(){
    seed|=0;seed=seed+0x6D2B79F5|0;
    let t=Math.imul(seed^seed>>>15,1|seed);
    t=t+Math.imul(t^t>>>7,61|t)^t;
    return((t^t>>>14)>>>0)/4294967296;
  };
}
function Noise1(r){
  const g=new Float32Array(1024);for(let i=0;i<1024;i++)g[i]=r();
  return x=>{const i=Math.floor(x),f=x-i,u=f*f*(3-2*f);return g[i&1023]*(1-u)+g[(i+1)&1023]*u;};
}

  ctx.beginPath();ctx.moveTo(x-s,y);ctx.lineTo(x-s*.8,y-s*.6);ctx.quadraticCurveTo(x,y-s*1.25,x+s*.8,y-s*.6);ctx.lineTo(x+s,y);ctx.closePath();ctx.fill();ctx.stroke();
  ctx.fillStyle=`rgba(${INK},.8)`;ctx.beginPath();ctx.moveTo(x-s*.14,y);ctx.lineTo(x,y-s*.5);ctx.lineTo(x+s*.14,y);ctx.fill();
  ctx.beginPath();ctx.moveTo(x,y-s*.95);ctx.lineTo(x,y-s*1.7);ctx.stroke();
  ctx.fillStyle='rgba(179,38,30,.85)';ctx.beginPath();ctx.moveTo(x,y-s*1.7);ctx.quadraticCurveTo(x+s*.4,y-s*1.62,x+s*.6,y-s*1.5);ctx.lineTo(x,y-s*1.38);ctx.fill();
}
function fields(ctx,r,x,y,w,h){
  ctx.lineCap='round';
  for(let i=0;i<9;i++){const yy=y+i*h/9,ww=w*(.55+i*.05);ctx.strokeStyle=`rgba(${INK},${.25+r()*.2})`;ctx.lineWidth=.9;
    ctx.beginPath();ctx.moveTo(x-ww/2,yy+Math.sin(i)*2);ctx.bezierCurveTo(x-ww/5,yy-5,x+ww/5,yy+5,x+ww/2,yy+Math.cos(i)*2);ctx.stroke();}
}
function waterfall(ctx,r,x,y0,y1,w){
  ctx.fillStyle=`rgba(${PAPER},.97)`;ctx.fillRect(x-w/2,y0,w,y1-y0);
  for(let i=0;i<14;i++){const xx=x-w/2+r()*w;ctx.strokeStyle=`rgba(${INK},${.08+r()*.14})`;ctx.lineWidth=.7;ctx.beginPath();ctx.moveTo(xx,y0+r()*20);ctx.lineTo(xx+(r()-.5)*2,y1-r()*20);ctx.stroke();}
  const g=ctx.createRadialGradient(x,y1,2,x,y1,w*1.6);g.addColorStop(0,`rgba(${PAPER},1)`);g.addColorStop(1,`rgba(${PAPER},0)`);ctx.fillStyle=g;ctx.fillRect(x-w*2,y1-w*1.6,w*4,w*3.2);
}
function waterWash(ctx,x0,x1,y0,y1){
  const r=RNG(Math.round(x0*7+y0));
  for(let x=x0+60;x<x1-60;x+=90){const cx=x+(r()-.5)*60,cy=y0+(y1-y0)*(.45+r()*.4),rx=120+r()*120,ry=(y1-y0)*(.35+r()*.25);
    const g=ctx.createRadialGradient(cx,cy,0,cx,cy,rx);g.addColorStop(0,'rgba(58,128,138,.10)');g.addColorStop(1,'rgba(58,128,138,0)');
    ctx.save();ctx.translate(cx,cy);ctx.scale(1,ry/rx);ctx.translate(-cx,-cy);ctx.fillStyle=g;ctx.fillRect(cx-rx,cy-rx,rx*2,rx*2);ctx.restore();}
}
function waves(ctx,r,x0,x1,y0,y1,n,colored){
  if(colored)waterWash(ctx,x0,x1,y0,y1);
  for(let i=0;i<n;i++){const y=y0+Math.pow(r(),.75)*(y1-y0),x=x0+r()*(x1-x0),L=18+r()*100*(y-y0)/(y1-y0+1)+16;
    ctx.strokeStyle=`rgba(${INK},${.05+r()*.12})`;ctx.lineWidth=.6+r()*.8;ctx.beginPath();ctx.moveTo(x,y);ctx.bezierCurveTo(x+L*.3,y-1.5,x+L*.6,y+1.5,x+L,y);ctx.stroke();}
}
function mistBand(ctx,x0,x1,y,h,a,seed){
  const r=RNG(seed);
  for(let x=x0;x<x1;x+=260){const cx=x+r()*200,rx=240+r()*260,g=ctx.createRadialGradient(cx,y,0,cx,y,rx);
    g.addColorStop(0,`rgba(${PAPER},${a})`);g.addColorStop(1,`rgba(${PAPER},0)`);
    ctx.save();ctx.translate(cx,y);ctx.scale(1,h/rx);ctx.translate(-cx,-y);ctx.fillStyle=g;ctx.fillRect(cx-rx,y-rx,rx*2,rx*2);ctx.restore();}
}


function inkLine(ctx,w,a){ctx.strokeStyle=`rgba(${INK},${a==null?.85:a})`;ctx.lineWidth=w;ctx.lineCap='round';ctx.lineJoin='round';}
function wash(ctx,a){ctx.fillStyle=`rgba(${INK},${a})`;}
function stove(ctx,x,y,s,lit){

  ctx.beginPath();ctx.moveTo(x-s*.36,y);ctx.lineTo(x-s*.28,y-s*.62);ctx.quadraticCurveTo(x,y-s*.7,x+s*.28,y-s*.62);ctx.lineTo(x+s*.36,y);ctx.closePath();
  const g=ctx.createLinearGradient(x-s*.4,0,x+s*.4,0);g.addColorStop(0,`rgba(${INK},.32)`);g.addColorStop(.5,`rgba(${INK},.12)`);g.addColorStop(1,`rgba(${INK},.36)`);
  ctx.fillStyle=`rgba(${PAPER},.95)`;ctx.fill();ctx.fillStyle=g;ctx.fill();inkLine(ctx,1.4*s/60);ctx.stroke();
  ctx.beginPath();ctx.ellipse(x,y-s*.64,s*.29,s*.05,0,0,7);inkLine(ctx,1.2*s/60,.8);ctx.stroke();
  ctx.beginPath();ctx.moveTo(x-s*.12,y-s*.02);ctx.lineTo(x-s*.12,y-s*.2);ctx.arc(x,y-s*.2,s*.12,Math.PI,0);ctx.lineTo(x+s*.12,y-s*.02);ctx.closePath();
  wash(ctx,lit?.2:.75);ctx.fill();
  if(lit){const fg=ctx.createRadialGradient(x,y-s*.1,1,x,y-s*.1,s*.2);fg.addColorStop(0,'rgba(214,92,40,.95)');fg.addColorStop(.6,'rgba(179,38,30,.55)');fg.addColorStop(1,'rgba(179,38,30,0)');ctx.fillStyle=fg;ctx.fill();}
}
function kettle(ctx,x,y,s){
  ctx.beginPath();ctx.ellipse(x,y-s*.22,s*.3,s*.22,0,0,7);ctx.fillStyle=`rgba(${PAPER},.97)`;ctx.fill();
  const g=ctx.createRadialGradient(x-s*.1,y-s*.3,s*.03,x,y-s*.2,s*.34);g.addColorStop(0,`rgba(${INK},.05)`);g.addColorStop(1,`rgba(${INK},.45)`);ctx.fillStyle=g;ctx.fill();
  inkLine(ctx,1.5*s/60);ctx.stroke();
  ctx.beginPath();ctx.moveTo(x+s*.26,y-s*.3);ctx.quadraticCurveTo(x+s*.44,y-s*.34,x+s*.5,y-s*.52);inkLine(ctx,3*s/60,.8);ctx.stroke();
  ctx.beginPath();ctx.moveTo(x-s*.2,y-s*.38);ctx.quadraticCurveTo(x,y-s*.78,x+s*.2,y-s*.38);inkLine(ctx,1.6*s/60,.85);ctx.stroke();
  ctx.beginPath();ctx.ellipse(x,y-s*.44,s*.1,s*.03,0,0,7);inkLine(ctx,1.2*s/60,.8);ctx.stroke();
}
function teapot(ctx,x,y,s){
  ctx.beginPath();ctx.ellipse(x,y-s*.16,s*.22,s*.16,0,0,7);ctx.fillStyle=`rgba(${PAPER},.97)`;ctx.fill();wash(ctx,.3);ctx.fill();inkLine(ctx,1.4*s/60);ctx.stroke();
  ctx.beginPath();ctx.moveTo(x-s*.2,y-s*.18);ctx.quadraticCurveTo(x-s*.36,y-s*.2,x-s*.4,y-s*.34);inkLine(ctx,2.6*s/60,.85);ctx.stroke();
  ctx.beginPath();ctx.ellipse(x+s*.26,y-s*.18,s*.07,s*.09,0,0,7);inkLine(ctx,1.8*s/60,.85);ctx.stroke();
  ctx.beginPath();ctx.ellipse(x,y-s*.31,s*.08,s*.025,0,0,7);ctx.stroke();ctx.beginPath();ctx.arc(x,y-s*.35,s*.025,0,7);wash(ctx,.8);ctx.fill();
}
function cup(ctx,x,y,s){
  ctx.beginPath();ctx.moveTo(x-s*.1,y-s*.12);ctx.quadraticCurveTo(x-s*.09,y,x,y);ctx.quadraticCurveTo(x+s*.09,y,x+s*.1,y-s*.12);ctx.closePath();
  ctx.fillStyle=`rgba(${PAPER},.97)`;ctx.fill();wash(ctx,.18);ctx.fill();inkLine(ctx,1.2*s/60);ctx.stroke();
  ctx.beginPath();ctx.ellipse(x,y-s*.12,s*.1,s*.022,0,0,7);ctx.stroke();
}
function caddy(ctx,x,y,s){
  ctx.beginPath();ctx.rect(x-s*.11,y-s*.3,s*.22,s*.3);ctx.fillStyle=`rgba(${PAPER},.97)`;ctx.fill();
  const g=ctx.createLinearGradient(x-s*.11,0,x+s*.11,0);g.addColorStop(0,`rgba(${INK},.35)`);g.addColorStop(.5,`rgba(${INK},.1)`);g.addColorStop(1,`rgba(${INK},.4)`);ctx.fillStyle=g;ctx.fill();inkLine(ctx,1.3*s/60);ctx.stroke();
  ctx.beginPath();ctx.ellipse(x,y-s*.3,s*.11,s*.03,0,0,7);ctx.fillStyle=`rgba(${INK},.55)`;ctx.fill();ctx.stroke();
  ctx.fillStyle=`rgba(${PAPER},.95)`;ctx.fillRect(x-s*.06,y-s*.22,s*.12,s*.12);ctx.fillStyle=`rgba(179,38,30,.8)`;ctx.font=`${s*.1}px 'QJ Brush','Ma Shan Zheng',serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('茶',x,y-s*.16);
}
function steam(ctx,x,y,s,t){
  for(let k=0;k<3;k++){const ph=t*1.3+k*2.1,yy=y-s*(.2+((t*.35+k*.33)%1)*.7),al=Math.sin(((t*.35+k*.33)%1)*Math.PI)*.35;
    ctx.beginPath();ctx.moveTo(x+Math.sin(ph)*s*.05,yy+s*.12);ctx.bezierCurveTo(x+Math.sin(ph+1)*s*.12,yy+s*.06,x+Math.sin(ph+2)*s*.12,yy-s*.04,x+Math.sin(ph+3)*s*.06,yy-s*.12);
    ctx.strokeStyle=`rgba(${INK},${al})`;ctx.lineWidth=1.4*s/60;ctx.stroke();}
}



function inkHorse(ctx,x,y,s,o){
  o=o||{};const r=RNG(o.seed||7),n=Noise1(r),coat=o.coat==null?.7:o.coat,k=s/100;
  const P=(u,v)=>[x+(u-50)*k,y+(v-80)*k];
  const hu=o.head||0;           // 抬头：头颈上移
  const Hd=(u,v)=>P(u,v-hu*4*(1-(u-10)/30));

  ctx.fillStyle=`rgba(${INK},.08)`;ctx.beginPath();ctx.ellipse(x,y+1,s*.4,s*.035,0,0,7);ctx.fill();

  const legs=o.phase?
    [[[34,40],[38,61],[37,76],[35,80]],[[75,40],[72,61],[76,76],[75,80]],[[29,41],[24,61],[23,76],[21,80]],[[70,40],[76,62],[73,76],[72,80]]]:
    [[[34,40],[32,61],[33,76],[31,80]],[[75,40],[79,61],[78,76],[77,80]],[[29,41],[31,61],[32,76],[31,80]],[[70,40],[70,61],[71,76],[69,80]]];
  const thigh=(L,far,front)=>{const a=P(...L[0]),b=P(...L[1]);const w0=(front?9:12)*k,w1=(front?4.2:4.6)*k;const dx=b[0]-a[0],dy=b[1]-a[1],m=Math.hypot(dx,dy)||1,nx=-dy/m,ny=dx/m;
    const path=new Path2D();path.moveTo(a[0]+nx*w0/2,a[1]+ny*w0/2);path.quadraticCurveTo((a[0]+b[0])/2+nx*w0*.42,(a[1]+b[1])/2+ny*w0*.42,b[0]+nx*w1/2,b[1]+ny*w1/2);path.lineTo(b[0]-nx*w1/2,b[1]-ny*w1/2);path.quadraticCurveTo((a[0]+b[0])/2-nx*w0*.3,(a[1]+b[1])/2-ny*w0*.3,a[0]-nx*w0/2,a[1]-ny*w0/2);path.closePath();
    ctx.fillStyle=`rgba(${PAPER},.95)`;ctx.fill(path);ctx.fillStyle=`rgba(${INK},${(far?.1:.14)+coat*(far?.32:.48)})`;ctx.fill(path);};
  const shin=(L,far,i)=>{const pts=[];for(let j=1;j<L.length-1;j++){const a=P(...L[j]),b=P(...L[j+1]);for(let t=0;t<1;t+=.2)pts.push([a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t]);}pts.push(P(...L[L.length-1]));
    brush(ctx,pts,{noise:n,w:(far?3:3.6)*k,a:far?.4+coat*.3:.6+coat*.35,dry:.15,bristles:3,off:i*20,taper:.12});
    const h=P(...L[L.length-1]);ctx.fillStyle=`rgba(${INK},${far?.55:.88})`;ctx.beginPath();ctx.ellipse(h[0]-1.4*k,h[1]-1*k,2.6*k,1.5*k,0,0,7);ctx.fill();
    const kn=P(...L[1]);ctx.beginPath();ctx.ellipse(kn[0],kn[1],2.3*k,2*k,0,0,7);ctx.fillStyle=`rgba(${INK},${far?.35:.55})`;ctx.fill();};
  legs.forEach((L,i)=>{const far=i<2;if(far){thigh(L,true,i===0);shin(L,true,i);}});
  legs.forEach((L,i)=>{if(i>=2)thigh(L,false,i===2);});

  const body=new Path2D();
  const E=(u,v,rx,ry,rot)=>{const c=P(u,v);body.moveTo(c[0]+rx*k,c[1]);body.ellipse(c[0],c[1],rx*k,ry*k,rot||0,0,Math.PI*2);};
  E(52,40,25,12);E(30,40,11,12);E(73,38,12,12.5);E(37,32,9,6.5);
  let a=Hd(24,44),b=Hd(19,27),c=Hd(12,15),d=Hd(21,8),e=Hd(30,18),f=P(41,30);
  body.moveTo(a[0],a[1]);body.quadraticCurveTo(b[0],b[1],c[0],c[1]);body.lineTo(d[0],d[1]);body.quadraticCurveTo(e[0],e[1],f[0],f[1]);body.closePath();
  const hp=[[21,8],[15,6.5],[9,11],[3,19],[2.5,22],[6,24],[12,21],[16,17]].map(q=>Hd(...q));
  body.moveTo(hp[0][0],hp[0][1]);for(let i=1;i<hp.length;i++){const m=[(hp[i-1][0]+hp[i][0])/2,(hp[i-1][1]+hp[i][1])/2];body.quadraticCurveTo(hp[i-1][0],hp[i-1][1],m[0],m[1]);}body.closePath();
  const ear=[Hd(17,8),Hd(18.5,1.5),Hd(20.5,7)];body.moveTo(ear[0][0],ear[0][1]);body.lineTo(ear[1][0],ear[1][1]);body.lineTo(ear[2][0],ear[2][1]);body.closePath();
  ctx.fillStyle=`rgba(${PAPER},.96)`;ctx.fill(body);
  const top=P(0,20)[1],bot=P(0,54)[1];
  const g=ctx.createLinearGradient(0,top,0,bot);g.addColorStop(0,`rgba(${INK},${.18+coat*.72})`);g.addColorStop(.6,`rgba(${INK},${.1+coat*.55})`);g.addColorStop(1,`rgba(${INK},${.04+coat*.3})`);
  ctx.fillStyle=g;ctx.fill(body);
  legs.forEach((L,i)=>{if(i>=2)shin(L,false,i);});
  ctx.save();ctx.clip(body);

  const hl=(u,v,rr,al)=>{const cc=P(u,v),gg=ctx.createRadialGradient(cc[0],cc[1],0,cc[0],cc[1],rr*k);gg.addColorStop(0,`rgba(${PAPER},${al})`);gg.addColorStop(1,`rgba(${PAPER},0)`);ctx.fillStyle=gg;ctx.fillRect(cc[0]-rr*k,cc[1]-rr*k,rr*2*k,rr*2*k);};
  hl(52,51,15,.32*coat+.12);hl(31,36,7,.16*coat);hl(72,33,7,.16*coat);
  if(o.spots){for(let i=0;i<9;i++){const cc=P(40+r()*40,32+r()*14);ctx.fillStyle=`rgba(${PAPER},${.5+r()*.3})`;ctx.beginPath();ctx.ellipse(cc[0],cc[1],(2+r()*4)*k,(1.5+r()*3)*k,r()*3,0,7);ctx.fill();}}
  ctx.restore();

  const crest=[[20,8],[26,13],[32,21],[38,28],[48,28.5],[60,28],[72,26],[81,29],[85,34]].map(q=>q[0]<40?Hd(...q):P(...q));
  const sm=[];for(let i=0;i<crest.length-1;i++)for(let t=0;t<1;t+=.25)sm.push([crest[i][0]+(crest[i+1][0]-crest[i][0])*t,crest[i][1]+(crest[i+1][1]-crest[i][1])*t]);sm.push(crest[crest.length-1]);
  brush(ctx,sm,{noise:n,w:2.4*k,a:.75+coat*.2,dry:.25,bristles:3,off:3});
  const belly=[[26,50],[40,52],[55,52.5],[68,49]].map(q=>P(...q));const bm=[];for(let i=0;i<belly.length-1;i++)for(let t=0;t<1;t+=.25)bm.push([belly[i][0]+(belly[i+1][0]-belly[i][0])*t,belly[i][1]+(belly[i+1][1]-belly[i][1])*t]);
  brush(ctx,bm,{noise:n,w:1.5*k,a:.45+coat*.3,dry:.45,bristles:2,off:9,wet:false});

  const ey=Hd(12.5,13),ns=Hd(4.5,20);ctx.fillStyle=`rgba(${INK},.9)`;ctx.beginPath();ctx.ellipse(ey[0],ey[1],1.2*k,.8*k,0,0,7);ctx.fill();ctx.beginPath();ctx.ellipse(ns[0],ns[1],.8*k,.6*k,0,0,7);ctx.fill();

  for(let i=0;i<9;i++){const t=i/8,u=20+t*17,v=8+t*19,st=Hd(u,v);
    const len=(5+r()*5)*k,ang=-.4+t*.3+(r()-.5)*.3,pts=[st];for(let j=1;j<6;j++)pts.push([st[0]+Math.cos(ang)*len*j/5+len*.25*(j/5)*(j/5),st[1]-Math.sin(ang)*len*j/5*.6+len*.12*j/5]);
    brush(ctx,pts,{noise:n,w:1.8*k,a:.7+coat*.25,dry:.3,bristles:3,off:40+i*7,taper:.4});}

  const tb=P(84,31),sw=o.phase?1:-1;
  for(let i=0;i<7;i++){const sp=(i-3)*1.3,len=.8+r()*.35,pts=[];
    for(let j=0;j<=12;j++){const t=j/12*len;pts.push([tb[0]+(6*Math.sin(t*2.2)+t*4+sp*t*1.2+sw*t*t*3)*k,tb[1]+(t*31+sp*t*.3)*k]);}
    brush(ctx,pts,{noise:n,w:(2.8-Math.abs(i-3)*.35)*k,a:.62+coat*.28,dry:.3+Math.abs(i-3)*.05,bristles:3,off:80+i*11,taper:.3});}
}


function sealCanvas(cv,txt){
  const ctx=cv.getContext('2d');const S=cv.width;ctx.clearRect(0,0,S,S);
  ctx.fillStyle='#b3261e';ctx.beginPath();ctx.roundRect(S*.04,S*.04,S*.92,S*.92,S*.07);ctx.fill();
  ctx.fillStyle='#f4ead6';ctx.textAlign='center';ctx.textBaseline='middle';
  const F=`'QJ Brush','Ma Shan Zheng','STKaiti','KaiTi',serif`;
  if(txt.length===4){ctx.font=`${S*.38}px ${F}`;ctx.fillText(txt[0],S*.7,S*.3);ctx.fillText(txt[1],S*.7,S*.71);ctx.fillText(txt[2],S*.3,S*.3);ctx.fillText(txt[3],S*.3,S*.71);}
  else if(txt.length===2){ctx.font=`${S*.46}px ${F}`;ctx.fillText(txt[0],S*.5,S*.3);ctx.fillText(txt[1],S*.5,S*.72);}
  else{ctx.font=`${S*.6}px ${F}`;ctx.fillText(txt,S*.5,S*.53);}
  ctx.globalCompositeOperation='destination-out';const r=RNG(txt.charCodeAt(0));
  for(let i=0;i<S*2.2;i++){ctx.fillStyle=`rgba(0,0,0,${r()*.7})`;ctx.beginPath();ctx.arc(r()*S,r()*S,r()*S*.012,0,7);ctx.fill();}
  ctx.globalCompositeOperation='source-over';
}

function fitCanvas(cv,w,h,maxDpr){
  const dpr=Math.min(maxDpr||2,window.devicePixelRatio||1);
  cv.width=Math.max(1,Math.round(w*dpr));cv.height=Math.max(1,Math.round(h*dpr));
  const c=cv.getContext('2d');c.setTransform(dpr,0,0,dpr,0,0);return c;
}

/* ---- core/ui.js ---- */


const $=id=>document.getElementById(id);
function el(tag,cls,html){const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e;}
const reduceMotion=()=>typeof matchMedia!=='undefined'&&matchMedia('(prefers-reduced-motion: reduce)').matches;

function createLevelUI(audio){
  let cur=null,onDone=null;
  const ui={
    get stage(){return $('lvStage');},
    open(level,done){
      cur=level;onDone=done;$('lvName').textContent=level.title;$('lvStageName').textContent='';$('lvMeter').innerHTML='';
      $('lvStage').innerHTML='';ui.hideResult();ui.say('');ui.acts([]);$('level').hidden=false;
      audio.setMood('level');audio.paper();
      requestAnimationFrame(()=>level.start(ui,audio));
    },
    close(){if(cur&&cur.stop)cur.stop();cur=null;$('level').hidden=true;$('lvStage').innerHTML='';audio.setMood('scroll');},
    stageName(t){$('lvStageName').textContent=t;},
    meter(html){$('lvMeter').innerHTML=html;},
    say(html){$('say').innerHTML=html;},
    acts(list){const a=$('acts');a.innerHTML='';list.forEach(([t,fn,red,dis])=>{const b=el('button','btn'+(red?' red':''),t);if(dis)b.disabled=true;b.onclick=fn;a.appendChild(b);});},
    result(grade,nums,line,top){$('rGrade').textContent=grade;$('rNums').innerHTML=nums;$('rLine').innerHTML=line;$('result').classList.toggle('top',!!top);$('result').hidden=false;},
    hideResult(){$('result').hidden=true;},
    flash(text,x,y){const f=el('div','flash',text);f.style.left=x+'px';f.style.top=y+'px';ui.stage.appendChild(f);
      requestAnimationFrame(()=>{f.style.transform='translate(-50%,-170%)';f.style.opacity=0;});setTimeout(()=>f.remove(),1100);},
    colophon(){
      const c=cur.colophon,v=$('coloV');v.innerHTML='';
      v.appendChild(el('div','h',c.head));c.lines.forEach(t=>v.appendChild(el('p','',t)));if(c.note)v.appendChild(el('p','s',c.note));
      const cv=el('canvas','sealbig');cv.width=cv.height=144;v.appendChild(cv);sealCanvas(cv,c.seal);
      const box=$('colo');box.hidden=false;box.classList.remove('stamped');
      setTimeout(()=>{box.classList.add('stamped');audio.thud();},500);$('coloBack').focus();
    },
    finish(){const id=cur.id;$('colo').hidden=true;ui.close();onDone&&onDone(id);}
  };
  $('lvClose').onclick=()=>ui.close();

const MISTS=[[6500,560,900,120,110,160],[5600,520,1100,110,95,200],[4700,610,900,90,120,150],[3900,500,1000,120,100,180],[3100,560,1300,150,130,220],[2300,620,900,100,105,160],[1500,560,1100,120,115,200],[600,590,900,110,100,160]];

function createScroll({levels,audio,onEnter}){
  let S=1,DPR=1,offset=0,tiles=[],preview=false;
  const done=new Set();try{JSON.parse(localStorage.getItem('qianli_done')||'[]').forEach(id=>done.add(id));}catch(e){}
  const persist=()=>{try{localStorage.setItem('qianli_done',JSON.stringify([...done]));}catch(e){}};
  const reveal={};

  function computeScale(){
    const vw=innerWidth,vh=innerHeight;
    S=Math.min((vh-120)/H,Math.max(vw/1100,vh/1500));S=Math.max(.38,Math.min(1.25,S));
    DPR=Math.min(window.devicePixelRatio||1,(navigator.deviceMemory&&navigator.deviceMemory<4)?1:1.5);
    document.documentElement.style.setProperty('--s',S);
  }
  function makeTiles(){
    const track=$('track');track.querySelectorAll('.tile').forEach(t=>t.remove());tiles=[];track.style.width=TOTAL*S+'px';
    for(let x0=0;x0<TOTAL;x0+=TILE){
      const x1=Math.min(TOTAL,x0+TILE+3),e=el('div','tile');e.style.left=x0*S+'px';e.style.width=(x1-x0)*S+'px';
      const ci=el('canvas'),cc=el('canvas','c');e.appendChild(ci);e.appendChild(cc);track.insertBefore(e,$('life'));
      tiles.push({x0,x1,el:e,ci,cc,inkDone:false,colDone:false});
    }
  }
  function renderTile(t,colored){
    const cv=colored?t.cc:t.ci,w=t.x1-t.x0,k=S*DPR;cv.width=Math.ceil(w*k);cv.height=Math.ceil(H*k);
    const ctx=cv.getContext('2d');ctx.setTransform(k,0,0,k,-t.x0*k,0);
    paperBase(ctx,t.x0,0,w,H);
    for(const c of SCENE){if(c.x1<t.x0-4||c.x0>t.x1+4)continue;ctx.save();c.draw(ctx,colored);ctx.restore();}
    paperGrain(ctx,t.x0,0,w,H);
    if(colored)t.colDone=true;else t.inkDone=true;
  }
  let queue=[],busy=false;
  const distTo=(t,[a,b])=>t.x1<a?a-t.x1:t.x0>b?t.x0-b:0;
  const visibleRange=()=>[-offset/S,(-offset+innerWidth)/S];
  function schedule(t,colored){if(colored?t.colDone:t.inkDone)return;if(queue.some(q=>q.t===t&&q.c===colored))return;queue.push({t,c:colored});pump();}
  function pump(){if(busy)return;busy=true;
    const step=()=>{
      if(!queue.length){busy=false;return;}
      const vis=visibleRange();queue.sort((a,b)=>distTo(a.t,vis)-distTo(b.t,vis)+(a.c-b.c)*.1);
      const q=queue.shift();if(!(q.c?q.t.colDone:q.t.inkDone))renderTile(q.t,q.c);
      if(!q.c)$('loading').style.opacity=tiles.filter(t=>t.inkDone).some(t=>t.x1>vis[0]&&t.x0<vis[1])?0:1;
      applyMasks();setTimeout(step,0);
    };setTimeout(step,0);}
  function applyMasks(){
    for(const t of tiles){
      if(preview){t.cc.style.webkitMaskImage=t.cc.style.maskImage='none';t.cc.style.opacity=t.colDone?1:0;continue;}
      const layers=[];
      for(const L of levels){const rr=reveal[L.id];if(!rr)continue;if(L.x+rr+200<t.x0||L.x-rr-200>t.x1)continue;
        const cx=(L.x-t.x0)*S,cy=(L.y+140)*S,r0=rr*S;layers.push(`radial-gradient(circle at ${cx}px ${cy}px, #000 0, #000 ${r0}px, transparent ${r0+160*S}px)`);}
      if(layers.length&&t.colDone){t.cc.style.webkitMaskImage=t.cc.style.maskImage=layers.join(',');t.cc.style.opacity=1;}else t.cc.style.opacity=0;
    }
  }
  function needColorFor(id){const L=levels.find(l=>l.id===id);tiles.forEach(t=>{if(L.x+REACH>t.x0&&L.x-REACH<t.x1)schedule(t,true);});}

  
  function placeLife(){
    const life=$('life');life.innerHTML='';
    if(reduceMotion())return;
    MISTS.forEach(([x,y,w,h,dur,dx],i)=>{const m=el('div','mist');m.style.cssText=`left:${(x-w/2)*S}px;top:${(y-h/2)*S}px;width:${w*S}px;height:${h*S}px;--dur:${dur}s;--dx:${dx*S}px;animation-delay:${-i*17}s`;life.appendChild(m);});
    const svgNS='http://www.w3.org/2000/svg',svg=document.createElementNS(svgNS,'svg');svg.setAttribute('viewBox','0 0 90 40');svg.setAttribute('class','birds');
    [[8,22,1],[22,14,.9],[36,24,1.1],[52,10,.8],[66,20,.95]].forEach(([x,y,s],i)=>{const p=document.createElementNS(svgNS,'path');
      p.setAttribute('d',`M${x-6*s},${y} q${3*s},${-4*s} ${6*s},0 q${3*s},${-4*s} ${6*s},0`);p.setAttribute('fill','none');p.setAttribute('stroke','#1b1b1d');p.setAttribute('stroke-width','1.3');p.setAttribute('stroke-linecap','round');
      p.style.transformBox='fill-box';p.style.transformOrigin='center';p.animate([{transform:'scaleY(1)'},{transform:'scaleY(.35)'},{transform:'scaleY(1)'}],{duration:520+i*40,iterations:Infinity});svg.appendChild(p);});
    life.appendChild(svg);
    const fly=()=>{if(!document.body.contains(svg))return;const vis=visibleRange(),x=vis[0]+(vis[1]-vis[0])*(.55+Math.random()*.4),y=120+Math.random()*160;
      svg.style.left=x*S+'px';svg.style.top=y*S+'px';
      svg.animate([{transform:'translate(0,0)',opacity:0},{opacity:.8,offset:.15},{opacity:.8,offset:.8},{transform:`translate(${-520*S}px,${-50*S}px)`,opacity:0}],{duration:16000,easing:'linear'});
      setTimeout(fly,26000+Math.random()*18000);};
    setTimeout(fly,6000);
  }

  
  function placeMarks(){
    const m=$('marks');m.innerHTML='';
    const ht=el('div','head-title','<div class="t">千里江山</div><div class="t2">运筹录</div><div class="q">运筹帷幄之中　决胜千里之外</div>');ht.style.left=6690*S+'px';ht.style.top=90*S+'px';m.appendChild(ht);
    const hs=el('canvas');hs.width=hs.height=120;hs.style.cssText=`position:absolute;left:${6420*S}px;top:${560*S}px;width:${64*S}px;height:${64*S}px;transform:rotate(-4deg)`;m.appendChild(hs);sealCanvas(hs,'运筹帷幄');
    [['卷一　江南',6230],['卷二　市井',4930],['卷三　山川',3470],['卷四　江海',1790]].forEach(([t,x])=>{const c=el('div','chapter',t);c.style.left=x*S+'px';c.style.top=120*S+'px';m.appendChild(c);});
    const co=el('div','colophon','全卷无一张图片　山石皴擦皆由代码落笔<br>刘翰林@SUSTech　·　Claude');co.style.left=48*S+'px';co.style.top=140*S+'px';m.appendChild(co);
    levels.forEach(L=>{
      const t=el('div','tag'+(L.play&&!done.has(L.id)?' play':'')+(L.play?'':' locked')+(done.has(L.id)?' done':''));t.tabIndex=0;t.setAttribute('role','button');
      t.setAttribute('aria-label',L.nm+'，'+L.cp+(L.play?'':'，尚未开放'));t.dataset.id=L.id;t.style.left=L.x*S+'px';t.style.top=L.y*S+'px';
      t.innerHTML=`<div class="strip"><span class="nm">${L.nm}</span><span class="cp">${L.cp}</span></div><div class="pin"></div><canvas class="stamp" width="80" height="80"></canvas>`;
      sealCanvas(t.querySelector('.stamp'),L.nm.length>2?L.nm.slice(0,2):L.nm);
      t.addEventListener('click',()=>{if(dragMoved)return;openLeaf(L);});
      t.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openLeaf(L);}});
      m.appendChild(t);
    });
    $('sealCount').textContent=done.size;
  }

  
  let dragging=false,dragMoved=false,startX=0,lastX=0,vel=0,raf=0,pid=null;
  function setOffset(o){const min=Math.min(0,innerWidth-TOTAL*S);offset=Math.max(min,Math.min(0,o));$('track').style.transform=`translate3d(${offset}px,0,0)`;}
  function afterPan(){const vis=visibleRange();tiles.forEach(t=>{if(t.x1>vis[0]-TILE&&t.x0<vis[1]+TILE)schedule(t,false);});}
  const sc=$('scroll');
  sc.addEventListener('pointerdown',e=>{if(e.button>0)return;dragging=true;dragMoved=false;startX=lastX=e.clientX;vel=0;pid=e.pointerId;cancelAnimationFrame(raf);});
  sc.addEventListener('pointermove',e=>{if(!dragging||e.pointerId!==pid)return;
    if(!dragMoved&&Math.abs(e.clientX-startX)>6){dragMoved=true;sc.classList.add('drag');try{sc.setPointerCapture(pid);}catch(_){}}
    if(!dragMoved)return;const dx=e.clientX-lastX;lastX=e.clientX;vel=dx;setOffset(offset+dx);});
  const endDrag=()=>{if(!dragging)return;dragging=false;sc.classList.remove('drag');
    if(dragMoved){const glide=()=>{vel*=.93;if(Math.abs(vel)<.3){afterPan();return;}setOffset(offset+vel);raf=requestAnimationFrame(glide);};glide();setTimeout(()=>dragMoved=false,40);}};
  sc.addEventListener('pointerup',endDrag);sc.addEventListener('pointercancel',endDrag);
  sc.addEventListener('wheel',e=>{e.preventDefault();setOffset(offset-(Math.abs(e.deltaX)>Math.abs(e.deltaY)?e.deltaX:e.deltaY));afterPan();},{passive:false});
  addEventListener('keydown',e=>{if(!$('level').hidden||!$('leafModal').hidden||$('cover'))return;if(e.key==='ArrowLeft')panTo(offset+innerWidth*.6);if(e.key==='ArrowRight')panTo(offset-innerWidth*.6);});
  function panTo(target,ms,done){ms=ms==null?900:ms;const from=offset,t0=performance.now();cancelAnimationFrame(raf);
    const f=now=>{const k=Math.min(1,(now-t0)/ms),e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;setOffset(from+(target-from)*e);if(k<1)raf=requestAnimationFrame(f);else{afterPan();done&&done();}};raf=requestAnimationFrame(f);}
  const centerOn=x=>innerWidth/2-x*S;

  
  function openLeaf(L){

  function layout(){computeScale();makeTiles();placeMarks();placeLife();setOffset(innerWidth-TOTAL*S);

    const vis=visibleRange();tiles.slice().sort((a,b)=>distTo(a,vis)-distTo(b,vis)).forEach(t=>schedule(t,false));}
  addEventListener('resize',()=>{clearTimeout(window.__rz);window.__rz=setTimeout(()=>{const s0=S;computeScale();
    if(Math.abs(S-s0)/s0>.08){const center=(-offset+innerWidth/2)/s0;queue=[];layout();setOffset(innerWidth/2-center*S);afterPan();}
    else{S=s0;document.documentElement.style.setProperty('--s',s0);setOffset(offset);}},200);});
  buildScene();

  return{
    layout,
    togglePreview(){preview=!preview;
      if(preview){tiles.forEach(t=>schedule(t,true));document.querySelectorAll('.tag').forEach(t=>t.classList.add('done'));}
      else document.querySelectorAll('.tag').forEach(t=>t.classList.toggle('done',done.has(t.dataset.id)));

const GENG_PER_UNIT=14;                       // 逻辑长度 → 更（《更路簿》里的航程单位）
function tspDist(a,b){return Math.hypot(a[0]-b[0],a[1]-b[1]);}
function tourLen(route,pts,closed){let s=0;for(let i=0;i<route.length-1;i++)s+=tspDist(pts[route[i]],pts[route[i+1]]);if(closed&&route.length>1)s+=tspDist(pts[route[route.length-1]],pts[route[0]]);return s;}
function geng(L){return Math.round(L*GENG_PER_UNIT);}


function heldKarp(pts){
  const n=pts.length,N=1<<n,INF=1e18,dp=new Float64Array(N*n).fill(INF),par=new Int8Array(N*n).fill(-1);
  dp[1*n+0]=0;
  for(let m=1;m<N;m+=2)for(let j=0;j<n;j++){const v=dp[m*n+j];if(v>=INF||!(m&(1<<j)))continue;
    for(let k=1;k<n;k++){if(m&(1<<k))continue;const nm=m|(1<<k),nv=v+tspDist(pts[j],pts[k]);if(nv<dp[nm*n+k]){dp[nm*n+k]=nv;par[nm*n+k]=j;}}}
  let best=INF,last=0;for(let j=1;j<n;j++){const v=dp[(N-1)*n+j]+tspDist(pts[j],pts[0]);if(v<best){best=v;last=j;}}
  const route=[];let m=N-1,j=last;while(j!==-1&&j!==0){route.push(j);const pj=par[m*n+j];m&=~(1<<j);j=pj;}route.push(0);route.reverse();
  return{route,len:best};
}
function nearestTour(pts,start){const n=pts.length,used=new Array(n).fill(false),r=[start];used[start]=true;
  for(let s=1;s<n;s++){const c=r[r.length-1];let bj=-1,bd=1e9;for(let j=0;j<n;j++)if(!used[j]){const v=tspDist(pts[c],pts[j]);if(v<bd){bd=v;bj=j;}}r.push(bj);used[bj]=true;}return r;}
function segCross(a,b,c,e){const o=(p,q,r)=>(q[0]-p[0])*(r[1]-p[1])-(q[1]-p[1])*(r[0]-p[0]);
  const d1=o(c,e,a),d2=o(c,e,b),d3=o(a,b,c),d4=o(a,b,e);return((d1>0&&d2<0)||(d1<0&&d2>0))&&((d3>0&&d4<0)||(d3<0&&d4>0));}

function crossings(route,pts){const n=route.length,out=[];
  for(let i=0;i<n;i++)for(let j=i+2;j<n;j++){if(i===0&&j===n-1)continue;
    const a=pts[route[i]],b=pts[route[(i+1)%n]],c=pts[route[j]],e=pts[route[(j+1)%n]];
    if(segCross(a,b,c,e)){const den=(a[0]-b[0])*(c[1]-e[1])-(a[1]-b[1])*(c[0]-e[0]);const t=((a[0]-c[0])*(c[1]-e[1])-(a[1]-c[1])*(c[0]-e[0]))/den;out.push({i,j,x:a[0]+t*(b[0]-a[0]),y:a[1]+t*(b[1]-a[1])});}}
  return out;}

function twoOptMove(route,i,j){const r=route.slice();let a=i+1,b=j;while(a<b){[r[a],r[b]]=[r[b],r[a]];a++;b--;}return r;}
function bestImprove(route,pts){const n=route.length;let best=null,gain=1e-9;
  for(let i=0;i<n-1;i++)for(let j=i+2;j<n;j++){if(i===0&&j===n-1)continue;
    const a=pts[route[i]],b=pts[route[i+1]],c=pts[route[j]],e=pts[route[(j+1)%n]];
    const g=tspDist(a,b)+tspDist(c,e)-tspDist(a,c)-tspDist(b,e);if(g>gain){gain=g;best=[i,j];}}
  return best;}
function twoOptLocal(route,pts){let r=route.slice(),mv;while((mv=bestImprove(r,pts)))r=twoOptMove(r,mv[0],mv[1]);return r;}
function orOpt(route,pts){let r=route.slice(),improved=true;const n=r.length;
  while(improved){improved=false;
    for(let len=1;len<=3&&!improved;len++)for(let i=1;i+len<=n&&!improved;i++){
      const seg=r.slice(i,i+len),rest=r.slice(0,i).concat(r.slice(i+len)),base=tourLen(r,pts,true);
      for(let k=0;k<rest.length&&!improved;k++){for(const sg of [seg,seg.slice().reverse()]){const cand=rest.slice(0,k+1).concat(sg,rest.slice(k+1));if(cand[0]!==0)continue;if(tourLen(cand,pts,true)<base-1e-9){r=cand;improved=true;break;}}}}}
  return r;}
function bestKnown(pts,tries){let best=null,bl=1e9;const r=RNG(99);
  for(let t=0;t<tries;t++){let perm=[0].concat(shuffle(pts.map((_,i)=>i).slice(1),r));perm=twoOptLocal(orOpt(twoOptLocal(perm,pts),pts),pts);const l=tourLen(perm,pts,true);if(l<bl){bl=l;best=perm;}}
  const nn=orOpt(twoOptLocal(nearestTour(pts,0),pts),pts);const ln=tourLen(nn,pts,true);if(ln<bl){bl=ln;best=nn;}
  return{route:best,len:bl};}

function genIslands(n,seed,A){
  const r=RNG(seed),pts=[[A*.9,.86]],minD=Math.sqrt(A/(n+1))*.62;let guard=0;
  while(pts.length<n+1&&guard++<20000){const p=[.06*A+r()*A*.84,.08+r()*.72];if(p[0]>A*.72&&p[1]>.7)continue;if(pts.every(q=>tspDist(p,q)>minD))pts.push(p);}
  return pts;}

function tangledTour(pts,seed,maxX){
  const r=RNG(seed);let best=null,bc=-1;
  for(let t=0;t<400;t++){const p=[0].concat(shuffle(pts.map((_,i)=>i).slice(1),r));const c=crossings(p,pts).length;if(c>bc&&c<=maxX){bc=c;best=p;}}
  return best;}
function tspGrade(ratio){return ratio<1.0005?'至短':ratio<1.03?'上品':ratio<1.1?'中品':'下品';}

        const e=Math.floor(lg),m=Math.pow(10,lg-e).toFixed(1),years=lg-8-Math.log10(3.15e7);
        count.innerHTML=`${n} 座岛，可走的航线约有 <b>${m} × 10<sup>${e}</sup></b> 条<br>每秒验一亿条，也要验 10<sup>${Math.floor(years)}</sup> 多年`;count.hidden=false;

      const pts=S.route.concat([S.route[0]]).map(k=>P(S.pts[k]));let total=0;const segL=[];for(let i=0;i<pts.length-1;i++){const l=Math.hypot(pts[i+1][0]-pts[i][0],pts[i+1][1]-pts[i][1]);segL.push(l);total+=l;}
      const dur=reduceMotion()?10:Math.min(3200,900+total*1.6),t0=performance.now();S.busy=true;boatCv.style.opacity=1;
      const f=now=>{if(!box.isConnected)return;const k=Math.min(1,(now-t0)/dur);let dd=k*total,i=0;while(i<segL.length-1&&dd>segL[i]){dd-=segL[i];i++;}
        const t=segL[i]?dd/segL[i]:0,x=pts[i][0]+(pts[i+1][0]-pts[i][0])*t,y=pts[i][1]+(pts[i+1][1]-pts[i][1])*t,flip=pts[i+1][0]<pts[i][0]?-1:1;

    function finishDraw(){
      const mine=tourLen(S.route,S.pts,true),opt=S.opt.len,ratio=mine/opt,g=tspGrade(ratio),cs=crossings(S.route,S.pts).length;
      if(S.stage===1){

        ui.result(g,`你的航程 <b>${geng(mine)}</b> 更　·　最短 <b>${geng(opt)}</b> 更`,
          ratio<1.0005?'一笔落成，正是最短航线。':cs?`多走了 ${Math.round((ratio-1)*100)}%。你的航线有 <b>${cs}</b> 处自己交叉——虚线是最短航线，它从不交叉。`:`多走了 ${Math.round((ratio-1)*100)}%。虚线是最短航线。`);
        ui.say(ratio<1.0005?'好眼力。下一程，老舵工的航线可没这么顺。':'留意你的航线和虚线差在哪里。下一程，替老舵工改航线。');

      if(showDark()){
        if(!S.sawDark){S.sawDark=true;ui.say(`明面上的交叉都解开了，航程 <b>${geng(after)}</b> 更。可还有<b>暗结</b>：两段航线虽不交叉，换个接法照样更短。点墨圈试试。`);}
        else ui.say(`又省一段：<b>${geng(after)}</b> 更。`);
        return;}
      const ratio=after/S.opt.len;
      ui.result(tspGrade(ratio),`老航线 <b>${geng(S.startLen)}</b> 更 → 解结后 <b>${geng(after)}</b> 更　·　最短 <b>${geng(S.opt.len)}</b> 更`,
        '你只反复做了一件事：拆掉两段航线，换个接法再连上。交叉是最显眼的结，每解一个，航程一定变短（三角形两边之和大于第三边）。');
      ui.say('这条规矩记下了：<b>航线相交，必有更短</b>。下一程岛多了，要靠它。');
      ui.acts([['下一程 →',()=>setup(3),true]]);drawRoute(ratio<1.0005?null:S.opt.route);
    }
    function animate(steps,delay,done){S.busy=true;let i=0;const f=()=>{if(!box.isConnected)return;if(i>=steps.length){S.busy=false;done&&done();return;}steps[i++]();setTimeout(f,delay);};f();}
    function runNearest(){
      if(S.busy)return;ui.hideResult();clearKnots();S.mode='tool';S.closed=false;S.route=[0];
      const nn=nearestTour(S.pts,0),steps=[];
      for(let k=1;k<nn.length;k++)steps.push(()=>{S.route.push(nn[k]);audio.tap(k,.12);refresh();drawRoute();});
      steps.push(()=>{S.closed=true;refresh();drawRoute();});
      ui.say('就近而行：每到一岛，就去离它最近、还没去过的岛。');
      animate(steps,70,()=>{const c=showKnots(),L=tourLen(S.route,S.pts,true);
        ui.say(`就近而行得 <b>${geng(L)}</b> 更，又快又不错，但留下了 <b>${c}</b> 处交叉。点「解结」，或者自己点红圈。`);S.mode='untie3';});
    }
    function runTwoOpt(){
      if(S.busy)return;

      ui.hideResult();clearKnots();const start=tourLen(S.route,S.pts,true);S.busy=true;
      const tick=()=>{if(!box.isConnected)return;const mv=bestImprove(S.route,S.pts);

    function finish3(mine,start){

        ratio<1.0005?'和长卷反复推演出的最好航线一样短。':`只比已知最好的航线多 ${pct}%，而用时不到一眨眼。`);

    }
    this._resize=()=>{if(!S.pts.length)return;layoutSea();drawSea();buildNodes();drawRoute();if(S.mode==='untie'||S.mode==='untie3'){if(!showKnots()&&S.stage===2&&document.getElementById('result').hidden)showDark();}};
    setup(1);
  },
  resize(){this._resize&&this._resize();},
  stop(){this._resize=null;}
};

const TEA_R1=[
  {id:'kettle',nm:'洗水壶',sh:'水壶',d:1,hands:true},
  {id:'boil',nm:'烧开水',sh:'烧水',d:15,hands:false,after:['kettle']},
  {id:'pot',nm:'洗茶壶',sh:'茶壶',d:1,hands:true},
  {id:'cups',nm:'洗茶杯',sh:'茶杯',d:1,hands:true},
  {id:'leaf',nm:'拿茶叶',sh:'茶叶',d:2,hands:true}
];

const TEA_R2=TEA_R1.map(t=>t.id==='cups'?Object.assign({},t,{d:4}):Object.assign({},t));
const TEA_TOKENS=3;          // 三枚「巧」字签：用在一道工序上，它就快一倍
const TEA_R2_TARGET=6;

function teaDur(tasks,tokens){const d={};tasks.forEach(t=>{let v=t.d;for(let i=0;i<((tokens&&tokens[t.id])||0);i++)v=Math.max(1,Math.ceil(v/2));d[t.id]=v;});return d;}

function teaSchedule(order,tasks,dur){
  const by={};tasks.forEach(t=>by[t.id]=t);dur=dur||teaDur(tasks);
  let hands=0,stove=0;const end={},items=[];
  for(const id of order){const t=by[id];
    const ready=Math.max(0,...(t.after||[]).map(a=>{if(end[a]==null)return Infinity;return end[a];}));
    if(!isFinite(ready))return null;
    let s;if(t.hands){s=Math.max(hands,ready);hands=s+dur[id];}else{s=Math.max(hands,ready,stove);stove=s+dur[id];}
    end[id]=s+dur[id];items.push({id,start:s,end:s+dur[id],lane:t.hands?'hands':'stove'});
  }
  const total=items.length?Math.max(...items.map(i=>i.end)):0;
  return{items,total,end};
}
function teaCanPlace(order,tasks,id){const t=tasks.find(x=>x.id===id);return(t.after||[]).every(a=>order.includes(a));}
function perms(a){if(a.length<=1)return[a];const out=[];a.forEach((x,i)=>perms(a.slice(0,i).concat(a.slice(i+1))).forEach(p=>out.push([x].concat(p))));return out;}
function teaAllTotals(tasks,dur){return perms(tasks.map(t=>t.id)).map(o=>teaSchedule(o,tasks,dur)).filter(Boolean).map(s=>s.total);}
function teaBest(tasks,dur){return Math.min(...teaAllTotals(tasks,dur));}

function teaBestOrder(tasks){const hands=tasks.filter(t=>t.hands&&t.id!=='kettle').map(t=>t.id);return['kettle','boil'].concat(hands);}

function teaCritical(tasks,dur,order){
  const base=teaSchedule(order,tasks,dur).total,out=new Set();
  tasks.forEach(t=>{const d2=Object.assign({},dur);d2[t.id]+=1;if(teaSchedule(order,tasks,d2).total>base)out.add(t.id);});
  return out;
}
function teaGrade1(total,best){return total<=best?'至妙':total<=best+1?'上品':total<=best+3?'中品':'下品';}
function teaGrade2(total){return total<=TEA_R2_TARGET?'至妙':total<=TEA_R2_TARGET+1?'上品':total<=TEA_R2_TARGET+3?'中品':'下品';}

function stopWinExact(n,k){if(k<=0)return 1/n;let s=0;for(let i=k+1;i<=n;i++)s+=1/(i-1);return k/n*s;}
function stopBestK(n){let bk=0,bp=0;for(let k=0;k<n;k++){const p=stopWinExact(n,k);if(p>bp){bp=p;bk=k;}}return{k:bk,p:bp};}

function stopSimulate(n,k,trials,rnd){
  const out=new Uint8Array(trials),v=new Float64Array(n);
  for(let t=0;t<trials;t++){
    let best=-1,bi=0;for(let i=0;i<n;i++){v[i]=rnd();if(v[i]>best){best=v[i];bi=i;}}
    let th=-1;for(let i=0;i<k;i++)if(v[i]>th)th=v[i];
    let pick=n-1;for(let i=k;i<n;i++)if(v[i]>th){pick=i;break;}
    out[t]=pick===bi?1:0;
  }
  return out;
}
function stopGrade(n,k){const r=stopWinExact(n,k)/stopBestK(n).p;return r>=.99?'至妙':r>=.9?'上品':r>=.7?'中品':'下品';}

function relRank(vals,i){let r=1;for(let j=0;j<i;j++)if(vals[j]>vals[i])r++;return r;}

      big.innerHTML=`先看 ${S.k} 匹：一千回里买到千里马 <b>${wins}</b> 回`;
      drawGrid(res,true);drawChart();setActs();
      if(S.tries.size===1)ui.say('每个朱点是一回买到了千里马。换一条规矩再推演，右边的图会记下每一次。');
      else if(S.tries.size===3&&!S.curve)ui.say('已经试了三条规矩。可以接着试，也可以看看完整的曲线。');
    }
    function drawGrid(res,animate){
      const cv=grid.querySelector('canvas'),W=grid.clientWidth,H=grid.clientHeight,c=fitCanvas(cv,W,H);
      const cols=50,rows=20,cw=W/cols,rh=H/rows,r=Math.max(1.2,Math.min(cw,rh)*.32);
      const paint=upto=>{c.clearRect(0,0,W,H);for(let i=0;i<1000;i++){const x=(i%cols+.5)*cw,y=(Math.floor(i/cols)+.5)*rh;
        if(res&&i<upto){c.fillStyle=res[i]?'rgba(179,38,30,.9)':`rgba(${INK},.22)`;c.beginPath();c.arc(x,y,res[i]?r*1.15:r*.8,0,7);c.fill();}
        else{c.fillStyle=`rgba(${INK},.06)`;c.beginPath();c.arc(x,y,r*.7,0,7);c.fill();}}};
      if(!res||!animate||reduceMotion()){paint(res?1000:0);return;}
      let upto=0;const step=()=>{if(!grid.isConnected)return;upto+=45;paint(upto);if(upto<1000)requestAnimationFrame(step);};step();
    }
    function drawChart(){
      const cv=chart.querySelector('canvas'),W=chart.clientWidth,H=chart.clientHeight,c=fitCanvas(cv,W,H);c.clearRect(0,0,W,H);
      const L=42,R=W-14,T=16,B=H-34,maxY=S.n===10?.5:.45,X=k=>L+(R-L)*k/(S.n-1),Y=p=>B-(B-T)*p/maxY,n=Noise1(RNG(2));
      c.font='12px "Noto Serif SC",serif';c.fillStyle=`rgba(${INK},.6)`;c.textAlign='right';c.textBaseline='middle';
      for(let p=0;p<=maxY+1e-9;p+=.1){c.strokeStyle=`rgba(${INK},${p?.08:.4})`;c.lineWidth=1;c.beginPath();c.moveTo(L,Y(p));c.lineTo(R,Y(p));c.stroke();c.fillText(Math.round(p*100)+'%',L-6,Y(p));}
      c.textAlign='center';c.textBaseline='top';const st=S.n===10?1:10;
      for(let k=0;k<S.n;k+=st){c.fillText(k,X(k),B+6);}if(S.n===100)c.fillText('99',X(99),B+6);
      c.fillText('先只看不买的匹数',(L+R)/2,B+20);
      c.save();c.translate(12,(T+B)/2);c.rotate(-Math.PI/2);c.fillText('买到千里马的赢面',0,-6);c.restore();
      if(S.curve){const pts=[];for(let k=0;k<S.n;k+=S.n===10?.25:1){const kk=Math.floor(k),fr=k-kk,p=kk>=S.n-1?stopWinExact(S.n,S.n-1):stopWinExact(S.n,kk)*(1-fr)+stopWinExact(S.n,kk+1)*fr;pts.push([X(k),Y(p)]);}
        brush(c,pts,{noise:n,w:2.6,a:.8,dry:.15,off:3,taper:.2});
        const b=stopBestK(S.n);c.fillStyle=`rgba(${INK},.85)`;c.beginPath();c.arc(X(b.k),Y(b.p),4,0,7);c.fill();c.font=`15px ${BRUSH_FONT}`;c.textBaseline='bottom';c.fillText('山顶 · 先看 '+b.k,X(b.k),Y(b.p)-8);c.textBaseline='top';c.font='12px "Noto Serif SC",serif';}

      c.strokeStyle='rgba(179,38,30,.35)';c.setLineDash([3,4]);c.beginPath();c.moveTo(X(S.k),T);c.lineTo(X(S.k),B);c.stroke();c.setLineDash([]);
      S.tries.forEach((p,k)=>{c.fillStyle='rgba(179,38,30,.92)';c.beginPath();c.arc(X(k),Y(p),5,0,7);c.fill();
        c.fillStyle=`rgba(${INK},.8)`;c.textBaseline='bottom';c.fillText(Math.round(p*100)+'%',X(k),Y(p)-7);c.textBaseline='top';});
    }
    function settle(){
      const p=stopWinExact(S.n,S.k),b=stopBestK(S.n),g=stopGrade(S.n,S.k);audio.arp();
      ui.result(g,`你的规矩：先看 <b>${S.k}</b> 匹，赢面 <b>${pct(p)}</b>　·　最好的规矩：先看 <b>${b.k}</b> 匹，<b>${pct(b.p)}</b>`,
        g==='至妙'?'正落在山顶。评的是规矩本身，不是某一回的运气。':S.k<b.k?'看得太少：心里还没数，就急着出手了。':'看得太多：好马多半已经被你放走了。');
      if(!S.curve){S.curve=true;drawChart();}
      if(S.round===2){ui.say(curveSay()+'<br>下一回马多了，这座山的山顶会移到哪里？');ui.acts([['再试试',()=>{ui.hideResult();setActs();}],['下一回 →',()=>lab(100),true]]);}
      else{ui.say(curveSay());ui.acts([['再试试',()=>{ui.hideResult();setActs();}],['题跋 · 钤印',()=>ui.colophon(),true]]);}
    }
    this._resize=()=>{if(S.round===1){if(cvBg){drawYard();if(S.horses.length)drawHorseAt(root.clientWidth*.48,0,0);}}else{drawGrid(lastRun,false);drawChart();}};
    round1();
  },
  resize(){this._resize&&this._resize();},
  stop(){this._resize=null;}
};

const MODULES={tsp:tspLevel,tea:teaLevel,horse:horseLevel};
const audio=createAudio();
const ui=createLevelUI(audio);
const scroll=createScroll({levels:LEVELS,audio,onEnter:id=>ui.open(MODULES[id],done=>scroll.complete(done))});

function setSnd(v){const on=audio.music(v);$('sndBtn').setAttribute('aria-pressed',on);$('sndBtn').textContent=on?'琴声 · 开':'琴声 · 关';}
$('sndBtn').onclick=()=>setSnd();
$('previewBtn').onclick=()=>$('previewBtn').setAttribute('aria-pressed',scroll.togglePreview());
$('nextBtn').onclick=()=>{if(!scroll.next())$('hint').textContent='三处已开放的关卡都参透了，其余八处正在绘制';};

function openScroll(){
  audio.unlock();setSnd(true);
  $('cover').classList.add('opening');
  const cur=$('curtain'),veil=cur.querySelector('.veil'),rod=cur.querySelector('.roller');cur.style.display='block';
  const dur=reduceMotion()?10:2200,t0=performance.now(),W=innerWidth;
  const f=now=>{const k=Math.min(1,(now-t0)/dur),e=1-Math.pow(1-k,3),x=W*(1-e);veil.style.right=(W-x)+'px';rod.style.left=x+'px';
    if(k<1)requestAnimationFrame(f);else{cur.style.display='none';$('cover').remove();}};
  requestAnimationFrame(f);
}
$('openBtn').onclick=openScroll;

const fontsReady=document.fonts&&document.fonts.ready?Promise.race([document.fonts.ready,new Promise(r=>setTimeout(r,2500))]):Promise.resolve();
fontsReady.then(()=>scroll.layout());
window.__qj={audio,scroll,ui,MODULES};   // 调试与自动化测试用

})();
