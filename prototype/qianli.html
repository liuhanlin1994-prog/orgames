<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>千里江山·运筹录</title>
<meta name="description" content="运筹学闯关游戏的水墨青绿风格样章：程序生成的长卷地图 + 可玩关卡「七洲洋」。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@400;600;700&display=swap">
<style>
:root{
  color-scheme:light;
  --paper:#efe6d1; --paper-hi:#f7f1e3; --paper-lo:#e3d7bd;
  --ink:#1b1b1d; --ink-2:#48474a; --ink-3:#8b877e;
  --cinnabar:#b3261e; --cinnabar-lo:rgba(179,38,30,.12);
  --azurite:#1e5b73; --malachite:#4c8a67; --ochre:#b3854f;
  --silk:#c5cdc5; --silk-dark:#8e9a92;
  --brush:'Ma Shan Zheng','STKaiti','KaiTi','Kaiti SC',serif;
  --serif:'Noto Serif SC','Songti SC','STSong','SimSun',serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;background:#d9ceb4;color:var(--ink);font-family:var(--serif)}
button{font-family:var(--serif);color:inherit}
button:focus-visible{outline:2px solid var(--cinnabar);outline-offset:2px}
#app{position:fixed;inset:0;overflow:hidden;background:#d8ccb1}

/* ---------- 长卷 ---------- */
#scroll{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);height:calc(900px * var(--s));
  cursor:grab;touch-action:none;box-shadow:0 18px 40px -18px rgba(60,40,10,.55),0 -18px 40px -24px rgba(60,40,10,.35)}
#scroll.drag{cursor:grabbing}
#scroll::before,#scroll::after{content:"";position:absolute;left:0;right:0;height:10px;z-index:3;pointer-events:none;
  background:linear-gradient(var(--silk-dark),var(--silk) 40%,var(--silk-dark))}
#scroll::before{top:-10px}#scroll::after{bottom:-10px}
#track{position:absolute;left:0;top:0;height:100%;will-change:transform}
.tile{position:absolute;top:0;height:100%}
.tile canvas{position:absolute;inset:0;width:100%;height:100%;display:block;z-index:1}
.tile canvas.c{opacity:0;z-index:2}
#marks{position:absolute;inset:0;pointer-events:none;z-index:3}

/* 题签 */
.tag{position:absolute;transform:translate(-50%,-100%);pointer-events:auto;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:calc(6px*var(--s))}
.tag .strip{writing-mode:vertical-rl;background:var(--paper-hi);border:1px solid rgba(60,50,30,.35);outline:1px solid rgba(60,50,30,.12);outline-offset:3px;
  padding:calc(12px*var(--s)) calc(7px*var(--s));display:flex;gap:calc(4px*var(--s));box-shadow:0 2px 6px rgba(60,40,10,.15);transition:transform .25s}
.tag .nm{font-family:var(--brush);font-size:calc(30px*var(--s));line-height:1.05;letter-spacing:.08em;color:var(--ink)}
.tag .cp{font-size:calc(13px*var(--s));color:var(--ink-2);letter-spacing:.25em;margin-top:calc(4px*var(--s))}
.tag .pin{width:1px;height:calc(46px*var(--s));background:linear-gradient(rgba(27,27,29,.5),rgba(27,27,29,0))}
.tag:hover .strip,.tag:focus-visible .strip{transform:translateY(-3px)}
.tag:focus-visible{outline:none}.tag:focus-visible .strip{outline:2px solid var(--cinnabar)}
.tag.play .strip{border-color:var(--cinnabar)}
.tag.play .strip::after{content:"可入画";writing-mode:vertical-rl;font-size:calc(12px*var(--s));color:#fff;background:var(--cinnabar);padding:calc(6px*var(--s)) calc(3px*var(--s));margin-top:calc(6px*var(--s));letter-spacing:.2em}
.tag.play .strip{animation:beckon 2.4s ease-in-out infinite}
@keyframes beckon{0%,100%{box-shadow:0 2px 6px rgba(60,40,10,.15),0 0 0 0 rgba(179,38,30,0)}50%{box-shadow:0 2px 6px rgba(60,40,10,.15),0 0 0 calc(8px*var(--s)) rgba(179,38,30,.16)}}
.tag .stamp{position:absolute;right:calc(-34px*var(--s));top:calc(8px*var(--s));width:calc(40px*var(--s));height:calc(40px*var(--s));opacity:0;transform:scale(2.2) rotate(-12deg)}
.tag.done .stamp{opacity:1;transform:scale(1) rotate(-6deg);transition:transform .35s cubic-bezier(.3,1.6,.5,1),opacity .15s}
.tag.done .strip::after{display:none}
.tag.done .strip{animation:none;border-color:rgba(60,50,30,.35)}

.chapter{position:absolute;transform:translate(-50%,0);writing-mode:vertical-rl;font-family:var(--brush);font-size:calc(22px*var(--s));color:var(--ink-2);letter-spacing:.3em;opacity:.75;pointer-events:none}
.head-title{position:absolute;transform:translate(-50%,0);writing-mode:vertical-rl;pointer-events:none;display:flex;flex-direction:column;gap:calc(22px*var(--s));align-items:flex-start}
.head-title .t{font-family:var(--brush);font-size:calc(118px*var(--s));line-height:1;color:var(--ink);letter-spacing:.06em}
.head-title .t2{font-family:var(--brush);font-size:calc(46px*var(--s));color:var(--ink);margin-top:calc(250px*var(--s));letter-spacing:.2em}
.head-title .q{font-size:calc(15px*var(--s));color:var(--ink-2);letter-spacing:.5em;margin-top:calc(330px*var(--s));line-height:2}
.colophon{position:absolute;transform:translate(-50%,0);writing-mode:vertical-rl;font-size:calc(13px*var(--s));line-height:2;color:var(--ink-2);letter-spacing:.3em;pointer-events:none}

/* ---------- 顶栏 ---------- */
#hud{position:absolute;left:0;right:0;top:0;z-index:20;display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px}
#hud .brand{margin-left:auto;display:flex;align-items:baseline;gap:10px;order:9}
#hud .brand b{font-family:var(--brush);font-weight:400;font-size:26px;letter-spacing:.08em}
#hud .brand small{font-size:12px;color:var(--ink-2);letter-spacing:.2em}
.count{font-size:13px;letter-spacing:.12em;color:var(--ink-2);display:flex;align-items:center;gap:6px}
.count b{font-family:var(--brush);font-size:22px;font-weight:400;color:var(--cinnabar)}
.btn{font-size:13px;letter-spacing:.1em;padding:7px 12px;border:1px solid rgba(40,35,25,.45);background:rgba(247,241,227,.75);cursor:pointer;border-radius:2px;transition:background .15s,transform .15s}
.btn:hover{background:var(--paper-hi);transform:translateY(-1px)}
.btn.red{background:var(--cinnabar);color:#fff;border-color:var(--cinnabar)}
.btn.red:hover{background:#9c1f18}
.btn[aria-pressed="true"]{background:var(--ink);color:var(--paper-hi)}
#hint{position:absolute;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:20;text-align:center;font-size:13px;letter-spacing:.2em;color:var(--ink-2);pointer-events:none;padding:0 16px}
#loading{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:5;font-family:var(--brush);font-size:28px;letter-spacing:.3em;color:var(--ink-2);pointer-events:none;transition:opacity .6s}

/* ---------- 开卷 ---------- */
#cover{position:absolute;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;background:#d8ccb1}
#cover .rolled{position:relative;display:flex;flex-direction:column;align-items:center;gap:26px;padding:0 16px}
#cover .rod{width:min(76vw,560px);height:46px;border-radius:23px;position:relative;
  background:linear-gradient(#e9dfc6,#cfc2a3 45%,#b8a984 55%,#e3d8bd);box-shadow:0 10px 24px -8px rgba(60,40,10,.5)}
#cover .rod::before,#cover .rod::after{content:"";position:absolute;top:-6px;width:22px;height:58px;border-radius:5px;background:linear-gradient(90deg,#5b3a22,#8a5a36,#4a2e1a)}
#cover .rod::before{left:-16px}#cover .rod::after{right:-16px}
#cover .label{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:var(--paper-hi);border:1px solid rgba(60,50,30,.4);padding:4px 18px;font-family:var(--brush);font-size:20px;letter-spacing:.3em;white-space:nowrap}
#cover .intro{max-width:30em;text-align:center;font-size:15px;line-height:2;color:var(--ink-2)}
#cover .intro q{font-family:var(--brush);font-size:22px;color:var(--ink);quotes:none;display:block;margin-bottom:6px;letter-spacing:.1em}
#cover.opening{background:transparent;pointer-events:none}
#cover.opening .rolled{opacity:0;transition:opacity .4s}
#curtain{position:absolute;inset:0;z-index:39;pointer-events:none;display:none}
#curtain .veil{position:absolute;top:0;bottom:0;left:0;right:0;background:#d8ccb1}
#curtain .roller{position:absolute;top:50%;transform:translate(-50%,-50%);width:26px;height:calc(900px*var(--s) + 40px);border-radius:13px;
  background:linear-gradient(90deg,#b8a984,#efe6cd 40%,#cdbf9e 60%,#a89773);box-shadow:6px 0 16px rgba(60,40,10,.35)}

/* ---------- 册页（关卡说明） ---------- */
.modal{position:absolute;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(40,32,18,.35);backdrop-filter:blur(2px)}
.modal[hidden]{display:none!important}
.leaf{position:relative;width:min(640px,100%);max-height:calc(100% - 20px);overflow:auto;background:var(--silk);padding:14px;box-shadow:0 30px 60px -20px rgba(40,25,5,.6)}
.leaf .in{background:var(--paper-hi);border:1px solid rgba(60,50,30,.25);padding:26px 26px 22px;display:grid;grid-template-columns:auto 1fr;gap:10px 26px}
.leaf .vt{grid-row:1 / span 3;writing-mode:vertical-rl;display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.leaf .vt .n{font-family:var(--brush);font-size:44px;line-height:1.05;letter-spacing:.1em}
.leaf .vt .c{font-size:14px;color:var(--cinnabar);letter-spacing:.35em;border-right:1px solid var(--cinnabar);padding-right:4px}
.leaf dl{margin:0;display:grid;gap:12px}
.leaf dt{font-size:12px;letter-spacing:.3em;color:var(--ink-3)}
.leaf dd{margin:2px 0 0;font-size:15px;line-height:1.85}
.leaf .aha{background:var(--cinnabar-lo);padding:8px 12px;border-left:2px solid var(--cinnabar)}
.leaf .acts{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.x{position:absolute;right:16px;top:16px;width:34px;height:34px;border:1px solid rgba(40,35,25,.35);background:var(--paper-hi);cursor:pointer;font-size:16px;line-height:1;border-radius:50%}
@media (max-width:560px){.leaf .in{grid-template-columns:1fr;padding:22px 18px}.leaf .vt{grid-row:auto;writing-mode:horizontal-tb;flex-direction:column;gap:4px}.leaf .vt .c{border:none;border-bottom:1px solid var(--cinnabar);padding:0 0 4px;align-self:flex-start}}

/* ---------- 关卡：七洲洋 ---------- */
#level{position:absolute;inset:0;z-index:60;background:var(--silk);display:flex;flex-direction:column;padding:calc(10px + env(safe-area-inset-top,0px)) 12px calc(10px + env(safe-area-inset-bottom,0px))}
#level[hidden]{display:none!important}
#level .bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:2px 4px 10px}
#level .ttl{display:flex;align-items:baseline;gap:10px}
#level .ttl b{font-family:var(--brush);font-weight:400;font-size:28px;letter-spacing:.08em}
#level .ttl span{font-size:13px;color:var(--ink-2);letter-spacing:.2em}
#level .meter{margin-left:auto;display:flex;align-items:baseline;gap:6px;font-variant-numeric:tabular-nums}
#level .meter b{font-family:var(--brush);font-weight:400;font-size:32px;line-height:1}
#level .meter small{font-size:12px;color:var(--ink-2)}
#sea{position:relative;flex:1;min-height:0;background:var(--paper);border:1px solid rgba(60,50,30,.3);overflow:hidden;touch-action:manipulation}
#sea canvas{position:absolute;inset:0;width:100%;height:100%}
#sea canvas.col{opacity:0;transition:opacity 1.6s ease}
#sea.colored canvas.col{opacity:1}
#nodes{position:absolute;inset:0}
.isl{position:absolute;transform:translate(-50%,-50%);width:48px;height:48px;border-radius:50%;border:none;background:transparent;cursor:pointer;padding:0}
.isl:focus-visible{outline:2px dashed var(--cinnabar)}
.isl .ring{position:absolute;inset:10px;border-radius:50%;border:2px solid transparent;transition:border-color .2s,transform .2s}
.isl:hover .ring{border-color:rgba(27,27,29,.35)}
.isl.on .ring{border-color:var(--cinnabar);transform:scale(1.1)}
.isl .nm{position:absolute;left:50%;top:-6px;transform:translate(-50%,-100%);font-family:var(--brush);font-size:18px;color:var(--ink);text-shadow:0 0 6px var(--paper),0 0 3px var(--paper);white-space:nowrap}
.isl.port .nm{font-size:17px;color:var(--cinnabar)}
.isl.cur .ring{border-color:var(--ink);border-style:dashed;animation:spin 6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.knot{position:absolute;transform:translate(-50%,-50%);width:44px;height:44px;border-radius:50%;border:2px dashed var(--cinnabar);background:rgba(179,38,30,.08);cursor:pointer;padding:0;animation:throb 1.4s ease-in-out infinite}
.knot::after{content:"结";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--brush);font-size:18px;color:var(--cinnabar)}
@keyframes throb{50%{transform:translate(-50%,-50%) scale(1.14)}}
.knot.dark{border-color:var(--ink);background:rgba(27,27,29,.06)}
.knot.dark::after{content:"暗";color:var(--ink)}
#boat{position:absolute;left:0;top:0;width:44px;height:36px;pointer-events:none;opacity:0;transition:opacity .3s}
#level .foot{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 4px 0;min-height:52px}
#level .say{flex:1 1 280px;font-size:15px;line-height:1.7}
#level .say b{color:var(--cinnabar);font-weight:600}
#level .acts{display:flex;gap:8px;flex-wrap:wrap}
#result{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);width:min(520px,calc(100% - 24px));background:rgba(247,241,227,.96);border:1px solid rgba(60,50,30,.35);padding:14px 16px;box-shadow:0 12px 30px -12px rgba(40,25,5,.5);display:grid;grid-template-columns:auto 1fr;gap:4px 16px;align-items:center}
#result[hidden]{display:none!important}
#result .grade{grid-row:1 / span 2;font-family:var(--brush);font-size:46px;line-height:1;color:var(--cinnabar);writing-mode:vertical-rl;letter-spacing:.1em}
#result .nums{font-size:14px;color:var(--ink-2);font-variant-numeric:tabular-nums}
#result .nums b{font-size:18px;color:var(--ink)}
#result .line{font-size:15px;line-height:1.7}
.count-big{position:absolute;left:12px;top:10px;font-size:13px;color:var(--ink-2);background:rgba(247,241,227,.85);padding:6px 10px;border:1px solid rgba(60,50,30,.2);line-height:1.6;max-width:calc(100% - 24px)}
.count-big b{font-family:var(--brush);font-weight:400;font-size:22px;color:var(--ink)}

/* 题跋 */
#colo{position:absolute;inset:0;z-index:70;display:flex;align-items:center;justify-content:center;background:rgba(40,32,18,.45);padding:16px}
#colo[hidden]{display:none!important}
#colo .sheet{position:relative;background:var(--silk);padding:14px;max-width:100%;max-height:100%;overflow:auto}
#colo .page{background:var(--paper-hi);border:1px solid rgba(60,50,30,.25);padding:26px 22px;display:flex;flex-direction:column;align-items:center;gap:16px}
#colo .v{writing-mode:vertical-rl;display:flex;flex-direction:column;flex-wrap:wrap;gap:18px;height:min(380px,56vh);align-items:flex-start;position:relative}
#colo .v .h{font-family:var(--brush);font-size:40px;letter-spacing:.12em}
#colo .v p{margin:0;font-size:16px;line-height:1.9;letter-spacing:.18em}
#colo .v p.s{font-size:13px;color:var(--ink-2)}
#colo .sealbig{align-self:flex-end;width:72px;height:72px;margin-right:6px;opacity:0;transform:scale(2.6) rotate(-14deg)}
#colo.stamped .sealbig{opacity:1;transform:scale(1) rotate(-5deg);transition:transform .38s cubic-bezier(.3,1.6,.5,1),opacity .12s}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

</head>
<body>
<div id="app">
  <div id="scroll" aria-label="千里江山长卷，可左右拖动">
    <div id="track"><div id="marks"></div></div>
  </div>

  <div id="hud">
    <div class="count" title="已钤印的关卡">钤印 <b id="sealCount">0</b> / 11</div>
    <button class="btn red" id="goPlay">直达 · 七洲洋</button>
    <button class="btn" id="previewBtn" aria-pressed="false">终卷预览</button>
    <button class="btn" id="sndBtn" aria-pressed="false">琴声 · 关</button>
    <div class="brand"><b>千里江山 · 运筹录</b><small>风格样章</small></div>
  </div>
  <div id="hint">手卷自右向左展开　·　拖动观卷　·　点题签看关卡</div>
  <div id="loading">研墨中</div>

  <div id="curtain"><div class="veil"></div><div class="roller"></div></div>
  <div id="cover">
    <div class="rolled">
      <div class="intro"><q>运筹帷幄之中，决胜千里之外</q>——《史记·高祖本纪》<br>「运筹学」这个中文译名，正出自这一句。</div>
      <div class="rod"><div class="label">千里江山 · 运筹录</div></div>
      <button class="btn red" id="openBtn" style="font-size:16px;padding:10px 28px;letter-spacing:.4em">展 卷</button>
    </div>
  </div>

  <div class="modal" id="leafModal" hidden>
    <div class="leaf" role="dialog" aria-modal="true" aria-labelledby="leafName">
      <div class="in">
        <div class="vt"><div class="n" id="leafName"></div><div class="c" id="leafConcept"></div></div>
        <dl>
          <div><dt>故 事</dt><dd id="leafStory"></dd></div>
          <div><dt>玩 法</dt><dd id="leafPlay"></dd></div>
          <div><dt>顿 悟</dt><dd class="aha" id="leafAha"></dd></div>
        </dl>
        <div class="acts" id="leafActs"></div>
      </div>
      <button class="x" id="leafX" aria-label="合上">✕</button>
    </div>
  </div>

  <div id="level" hidden>
    <div class="bar">
      <div class="ttl"><b>七洲洋</b><span id="stageName">第一程 · 凭直觉</span></div>
      <div class="meter"><small>航程</small><b id="dist">0</b><small>更 · 约 <span id="li">0</span> 里</small></div>
      <button class="btn" id="lvClose">回长卷</button>
    </div>
    <div id="sea">
      <canvas id="seaInk"></canvas><canvas id="seaCol" class="col"></canvas><canvas id="route"></canvas>
      <div id="nodes"></div>
      <canvas id="boat" width="88" height="72"></canvas>
      <div class="count-big" id="combo" hidden></div>
      <div id="result" hidden>
        <div class="grade" id="rGrade"></div>
        <div class="nums" id="rNums"></div>
        <div class="line" id="rLine"></div>
      </div>
    </div>
    <div class="foot">
      <div class="say" id="say"></div>
      <div class="acts" id="acts"></div>
    </div>
  </div>

  <div id="colo" hidden>
    <div class="sheet"><div class="page">
      <div class="v">
        <div class="h">旅行商问题</div>
        <p>遍访诸岛而返，求其至短。</p>
        <p>岛愈多，路数愈是爆炸，逐条枚举永不能尽。</p>
        <p>然航线相交，必有更短之走法；</p>
        <p>就近而行，再逐一解结，顷刻可得近优之解。</p>
        <p class="s">今之快递派送、巡检排程、电路钻孔，皆用此术。</p>
        <canvas class="sealbig" id="sealBig" width="144" height="144"></canvas>
      </div>
      <button class="btn red" id="coloBack">钤印 · 回到长卷</button>
    </div></div>
  </div>
</div>

<script>
"use strict";
/* ============================================================
   墨法：随机数、噪声、笔触
   ============================================================ */
function RNG(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function Noise1(r){const g=new Float32Array(1024);for(let i=0;i<1024;i++)g[i]=r();return x=>{const i=Math.floor(x),f=x-i,u=f*f*(3-2*f);return g[i&1023]*(1-u)+g[(i+1)&1023]*u;};}
function fbm(n,x,o){let a=0,amp=1,fr=1,s=0;for(let k=0;k<o;k++){a+=amp*n(x*fr+k*31.7);s+=amp;amp*=.5;fr*=2.03;}return a/s;}
const INK='27,27,29', PAPER='242,233,214';
if(!CanvasRenderingContext2D.prototype.roundRect)CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h){this.rect(x,y,w,h);};
const $=id=>document.getElementById(id);

let GRAIN=null;
function grainPattern(ctx){
  if(!GRAIN){const t=document.createElement('canvas');t.width=t.height=384;const c=t.getContext('2d'),r=RNG(11);
    c.fillStyle='#fff';c.fillRect(0,0,384,384);
    const id=c.getImageData(0,0,384,384),d=id.data;

/* 干湿笔：湿笔变宽多边形 + 干笔多毫断续 */
function brush(ctx,pts,o){

}

/* ---------- 山：单峰成形，前峰压后峰，山脚化入云气 ---------- */
function peakPts(n,p,base){
  const pts=[],x0=p.x-p.wl*1.08,x1=p.x+p.wr*1.08,rock=p.rock==null?1:p.rock,rd=p.round||.003,sr=Math.sqrt(rd);
  for(let x=x0;x<=x1;x+=2.5){
    const w=x<p.x?p.wl:p.wr,d=Math.abs(x-p.x)/w,dd=Math.sqrt(d*d+rd)-sr;
    let v=p.h*Math.pow(Math.max(0,1-dd),p.k||1.7);

    v+=p.h*.10*rock*(fbm(n,x*.018+p.x,4)-.5)*env*2;
    v+=p.h*.05*rock*(1-Math.abs(n(x*.06+p.x)*2-1)-.5)*env*2;
    v+=(n(x*.25+p.x)-.5)*1.4*env;
    pts.push([x,Math.min(base+1,base-v)]);
  }
  return pts;
}
function drawPeak(ctx,p,cfg,colored){
  const r=RNG(p.seed),n=Noise1(r);

  const pts=peakPts(n,p,base);let top=base;for(const q of pts)if(q[1]<top)top=q[1];
  const bottom=base+1;
  const path=new Path2D();path.moveTo(pts[0][0],bottom);for(const q of pts)path.lineTo(q[0],q[1]);path.lineTo(pts[pts.length-1][0],bottom);path.closePath();
  const oc=cfg.occ==null?.92:cfg.occ;
  let g=ctx.createLinearGradient(0,top,0,bottom);
  g.addColorStop(0,`rgba(${PAPER},${oc})`);g.addColorStop(.6,`rgba(${PAPER},${oc*.75})`);g.addColorStop(.9,`rgba(${PAPER},${oc*.25})`);g.addColorStop(1,`rgba(${PAPER},0)`);
  ctx.fillStyle=g;ctx.fill(path);
  g=ctx.createLinearGradient(0,top,0,bottom);
  g.addColorStop(0,`rgba(${ink},${a*.52})`);g.addColorStop(.4,`rgba(${ink},${a*.3})`);g.addColorStop(.8,`rgba(${ink},${a*.1})`);g.addColorStop(1,`rgba(${ink},0)`);

  }
  ctx.save();ctx.clip(path);

  const ridge=new Path2D();pts.forEach((q,i)=>i?ridge.lineTo(q[0],q[1]+4):ridge.moveTo(q[0],q[1]+4));
  ctx.lineJoin='round';
  for(const [lw,al] of [[30,.045],[20,.055],[12,.065],[6,.08],[2.5,.1]]){ctx.lineWidth=lw;ctx.strokeStyle=`rgba(${ink},${a*al*1.6})`;ctx.stroke(ridge);}
  // 山体折痕
  const folds=2+Math.floor(r()*3);
  for(let f=0;f<folds;f++){
    const side=r()<.5?-1:1,t0=.15+r()*.5,w=side<0?p.wl:p.wr;
    let x=p.x+side*w*t0*.6;const idx=Math.min(pts.length-1,Math.max(0,Math.round((x-pts[0][0])/2.5)));

  // 皴擦
  const cnt=Math.round((cfg.cun==null?1:cfg.cun)*(p.wl+p.wr)*p.h/170);
  ctx.lineCap='round';
  for(let i=0;i<cnt;i++){
    const k=1+Math.floor(r()*(pts.length-2)),q=pts[k];if(q[1]>base-3)continue;

  for(const q of pts){if(q[1]<base-4)seg.push([q[0],q[1]+.4]);else flush();}flush();
  // 苔点

      for(let j=0;j<c;j++){ctx.fillStyle=`rgba(${ink},${Math.min(1,a*1.3)*(.45+r()*.55)})`;ctx.beginPath();ctx.ellipse(q[0]+(r()-.5)*7,q[1]+r()*3-1,(1+r()*1.7)*(cfg.dot||1),(.7+r()*1.1)*(cfg.dot||1),r()*3,0,7);ctx.fill();}}}
  if(cfg.trees){for(let i=0;i<pts.length;i++){const q=pts[i];if(q[1]>base-10)continue;if(n(i*.03+p.x*.1)>.62&&r()<.16)tree(ctx,r,q[0],q[1]+2+r()*5,(6+r()*9)*cfg.trees,a);}}

function waves(ctx,r,x0,x1,y0,y1,n,colored){

function waterWash(ctx,x0,x1,y0,y1){

    const g=ctx.createRadialGradient(cx,cy,0,cx,cy,rx);g.addColorStop(0,'rgba(58,128,138,.10)');g.addColorStop(1,'rgba(58,128,138,0)');

function mistBand(ctx,x0,x1,y,h,a,seed){

}

let S=1,DPR=1,offset=0,tiles=[],doneSet=new Set(),preview=false;

function persist(){try{localStorage.setItem('qianli_done',JSON.stringify([...doneSet]));}catch(e){}}

function computeScale(){
  const vw=innerWidth,vh=innerHeight;
  S=Math.min((vh-120)/H,Math.max(vw/1100,vh/1500));S=Math.max(.38,Math.min(1.25,S));
  DPR=Math.min(window.devicePixelRatio||1,(navigator.deviceMemory&&navigator.deviceMemory<4)?1:1.5);
  document.documentElement.style.setProperty('--s',S);
}
function makeTiles(){
  const track=$('track');track.querySelectorAll('.tile').forEach(t=>t.remove());tiles=[];
  track.style.width=TOTAL*S+'px';
  for(let x0=0;x0<TOTAL;x0+=TILE){
    const x1=Math.min(TOTAL,x0+TILE+3);const el=document.createElement('div');el.className='tile';el.style.left=x0*S+'px';el.style.width=(x1-x0)*S+'px';
    const ci=document.createElement('canvas'),cc=document.createElement('canvas');cc.className='c';
    el.appendChild(ci);el.appendChild(cc);track.insertBefore(el,$('marks'));
    tiles.push({x0,x1,el,ci,cc,inkDone:false,colDone:false});
  }
}
function renderTile(t,colored){
  const cv=colored?t.cc:t.ci,w=(t.x1-t.x0),k=S*DPR;
  cv.width=Math.ceil(w*k);cv.height=Math.ceil(H*k);
  const ctx=cv.getContext('2d');ctx.setTransform(k,0,0,k,-t.x0*k,0);
  paperBase(ctx,t.x0,0,w,H);
  for(const c of SCENE){if(c.x1<t.x0-4||c.x0>t.x1+4)continue;ctx.save();c.draw(ctx,colored);ctx.restore();}
  paperGrain(ctx,t.x0,0,w,H);
  if(colored)t.colDone=true;else t.inkDone=true;

function drawRoute(ghost){
  const cv=$('route'),dpr=Math.min(2,window.devicePixelRatio||1);cv.width=LV.W*dpr;cv.height=LV.H*dpr;const c=cv.getContext('2d');c.setTransform(dpr,0,0,dpr,0,0);
  if(ghost){c.save();c.setLineDash([2,7]);c.lineCap='round';c.strokeStyle='rgba(30,91,115,.75)';c.lineWidth=2.2;c.beginPath();ghost.forEach((k,i)=>{const q=P(LV.pts[k]);i?c.lineTo(q[0],q[1]):c.moveTo(q[0],q[1]);});c.closePath();c.stroke();c.restore();}
  const r=LV.route,n=r.length,segs=LV.closed?n:n-1;
  for(let i=0;i<segs;i++){const a=r[i],b=r[(i+1)%n],p=P(LV.pts[a]),q=P(LV.pts[b]);
    const rr=RNG(Math.min(a,b)*977+Math.max(a,b)*131+7),L=Math.hypot(q[0]-p[0],q[1]-p[1]),bow=(rr()-.5)*L*.1;
    const mx=(p[0]+q[0])/2+(q[1]-p[1])/L*bow,my=(p[1]+q[1])/2-(q[0]-p[0])/L*bow,pts=[];
    const inset=Math.min(16,L*.2);
    for(let t=0;t<=1.0001;t+=1/Math.max(8,L/6)){const tt=inset/L+t*(1-2*inset/L),x=(1-tt)*(1-tt)*p[0]+2*(1-tt)*tt*mx+tt*tt*q[0],y=(1-tt)*(1-tt)*p[1]+2*(1-tt)*tt*my+tt*tt*q[1];pts.push([x,y]);}
    brush(c,pts,{noise:Noise1(rr),w:3.4,a:.82,dry:.22,bristles:3,off:rr()*40,taper:.45});
  }
}
function drawBoatSprite(){const c=$('boat').getContext('2d');c.clearRect(0,0,88,72);c.save();c.scale(2,2);boat(c,22,28,16,true);c.restore();}

function buildNodes(){
  const box=$('nodes');box.innerHTML='';
  LV.pts.forEach((p,i)=>{const q=P(p),b=document.createElement('button');b.className='isl'+(i===0?' port':'');b.style.left=q[0]+'px';b.style.top=q[1]+'px';
    b.setAttribute('aria-label',i===0?'刘家港':'岛'+(GAN[i-1]||i));
    b.innerHTML='<span class="ring"></span>'+(LV.stage<3?`<span class="nm">${i===0?'刘家港':(GAN[i-1]||'')}</span>`:(i===0?'<span class="nm">刘家港</span>':''));
    b.onclick=()=>tapIsland(i);box.appendChild(b);});
  refreshNodes();
}
function refreshNodes(){
  const els=$('nodes').querySelectorAll('.isl'),vis=new Set(LV.route),cur=LV.route[LV.route.length-1];
  els.forEach((el,i)=>{el.classList.toggle('on',vis.has(i)&&i!==0);el.classList.toggle('cur',!LV.closed&&i===cur&&LV.mode==='draw');});
  const L=lenOf(LV.route,LV.pts,LV.closed);$('dist').textContent=geng(L);$('li').textContent=(geng(L)*60).toLocaleString('zh-CN');
}
function clearKnots(){$('nodes').querySelectorAll('.knot').forEach(k=>k.remove());}
function showKnots(){
  clearKnots();const cs=crossings(LV.route,LV.pts);
  cs.forEach(cx=>{const q=P([cx.x,cx.y]),b=document.createElement('button');b.className='knot';b.style.left=q[0]+'px';b.style.top=q[1]+'px';b.setAttribute('aria-label','解开这个交叉');
    b.onclick=()=>untie(cx);$('nodes').appendChild(b);});
  return cs.length;
}
function say(html){$('say').innerHTML=html;}
function acts(list){const a=$('acts');a.innerHTML='';list.forEach(([t,fn,red])=>{const b=document.createElement('button');b.className='btn'+(red?' red':'');b.textContent=t;b.onclick=fn;a.appendChild(b);});}
function hideResult(){$('result').hidden=true;}
function showResult(grade,nums,line){$('rGrade').textContent=grade;$('rNums').innerHTML=nums;$('rLine').innerHTML=line;$('result').hidden=false;}

function startLevel(){
  $('level').hidden=false;$('sea').classList.remove('colored');hideResult();
  AU.unlock();
  requestAnimationFrame(()=>setupStage(1));
}
const STAGES={
  1:{name:'第一程 · 凭直觉',n:6,seed:1207},
  2:{name:'第二程 · 解结',n:11,seed:2311},
  3:{name:'第三程 · 群岛',n:29,seed:4409}
};
function setupStage(s){
  LV.stage=s;const st=STAGES[s],sea=$('sea');LV.A=Math.max(.72,Math.min(1.9,sea.clientWidth/sea.clientHeight));
  LV.pts=genPts(st.n,st.seed,LV.A);LV.closed=false;LV.route=[0];LV.mode='draw';
  $('stageName').textContent=st.name;$('combo').hidden=true;hideResult();clearKnots();$('sea').classList.remove('colored');$('boat').style.opacity=0;
  drawSea();buildNodes();
  if(s===1){LV.opt=heldKarp(LV.pts);
    say('宝船自<b>刘家港</b>出发，访遍六岛再回港。<br>依次点岛落笔，最后点回刘家港收笔。');
    acts([['撤回一笔',undo],['重画',()=>setupStage(1)]]);}
  if(s===2){LV.opt=heldKarp(LV.pts);
    // 老舵工的航线：刻意缠成一团
    const r=RNG(55);let best=null,bc=-1;for(let t=0;t<400;t++){const p=[0].concat(shuffle(LV.pts.map((_,i)=>i).slice(1),r));const c=crossings(p,LV.pts).length;if(c>bc&&c<=9){bc=c;best=p;}}
    LV.route=best;LV.closed=true;LV.mode='untie';LV.sawDark=false;LV.startLen=lenOf(best,LV.pts,true);
    say('老舵工画的航线缠成了一团。每个<b>红圈</b>是一处交叉——点它，把这个结解开，看航程怎么变。');
    acts([['还原老航线',()=>setupStage(2)]]);showKnots();}
  if(s===3){LV.opt=bestKnown(LV.pts,24);
    const n=LV.pts.length-1;let lg=0;for(let i=2;i<=n;i++)lg+=Math.log10(i);lg-=Math.log10(2);
    const e=Math.floor(lg),m=Math.pow(10,lg-e).toFixed(1);
    const years=lg-8-Math.log10(3.15e7);
    $('combo').innerHTML=`${n} 座岛，可走的航线约有 <b>${m} × 10<sup>${e}</sup></b> 条<br>每秒验一亿条，也要验 10<sup>${Math.floor(years)}</sup> 多年`;$('combo').hidden=false;
    say('二十九座岛，一条条比是比不完的。可以自己落笔，也可以请出两件巧器。');
    acts([['就近而行',()=>runNearest()],['解结',()=>runTwoOpt(),true],['自己画',()=>setupStage(3)]]);}
  refreshNodes();drawRoute();
}
function undo(){if(LV.busy||LV.closed||LV.route.length<=1)return;LV.route.pop();refreshNodes();drawRoute();}
function tapIsland(i){
  if(LV.busy||LV.mode!=='draw'||LV.closed)return;
  const r=LV.route;
  if(i===0){if(r.length===LV.pts.length){LV.closed=true;AU.arp();refreshNodes();drawRoute();sailThen(()=>finishDraw());}
    else{say(`还有 <b>${LV.pts.length-r.length}</b> 座岛没去。访遍了再回刘家港。`);}return;}
  if(r.includes(i)){if(i===r[r.length-1])undo();return;}
  r.push(i);AU.note(3+(i%9),.28);refreshNodes();drawRoute();
  if(r.length===LV.pts.length)say('诸岛已访遍，<b>点刘家港</b>收笔回港。');
}
function sailThen(done){
  const b=$('boat'),pts=LV.route.concat([LV.route[0]]).map(k=>P(LV.pts[k]));drawBoatSprite();
  let total=0;const segL=[];for(let i=0;i<pts.length-1;i++){const l=Math.hypot(pts[i+1][0]-pts[i][0],pts[i+1][1]-pts[i][1]);segL.push(l);total+=l;}
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches,dur=reduce?10:Math.min(3200,900+total*1.6),t0=performance.now();LV.busy=true;b.style.opacity=1;
  const f=now=>{const k=Math.min(1,(now-t0)/dur);let dd=k*total,i=0;while(i<segL.length-1&&dd>segL[i]){dd-=segL[i];i++;}
    const t=segL[i]?dd/segL[i]:0,x=pts[i][0]+(pts[i+1][0]-pts[i][0])*t,y=pts[i][1]+(pts[i+1][1]-pts[i][1])*t,flip=pts[i+1][0]<pts[i][0]?-1:1;
    b.style.transform=`translate(${x-22}px,${y-28}px) scaleX(${flip})`;
    if(k<1)requestAnimationFrame(f);else{b.style.opacity=0;LV.busy=false;done();}};requestAnimationFrame(f);
}
function grade(ratio){return ratio<1.0005?'至短':ratio<1.03?'上品':ratio<1.1?'中品':'下品';}
function finishDraw(){
  const mine=lenOf(LV.route,LV.pts,true),opt=LV.opt.len,ratio=mine/opt,g=grade(ratio),cs=crossings(LV.route,LV.pts).length;
  if(LV.stage===1){
    drawRoute(ratio<1.0005?null:LV.opt.route);
    showResult(g,`你的航程 <b>${geng(mine)}</b> 更　·　最短 <b>${geng(opt)}</b> 更`,
      ratio<1.0005?'一笔落成，正是最短航线。':cs?`多走了 ${Math.round((ratio-1)*100)}%。你的航线有 <b>${cs}</b> 处自己交叉——虚线是最短航线，它从不交叉。`:`多走了 ${Math.round((ratio-1)*100)}%。虚线是最短航线。`);
    say(ratio<1.0005?'好眼力。下一程，老舵工的航线可没这么顺。':'留意你的航线和虚线差在哪里。下一程，替老舵工改航线。');
    acts([['再画一次',()=>setupStage(1)],['下一程 →',()=>setupStage(2),true]]);
  } else if(LV.stage===3){ finishStage3(mine); }
}
function untie(cx){
  if(LV.busy)return;const before=lenOf(LV.route,LV.pts,true);
  LV.route=twoOptMove(LV.route,cx.i,cx.j);AU.rise();
  const after=lenOf(LV.route,LV.pts,true);drawRoute();refreshNodes();
  const left=showKnots();
  const flash=document.createElement('div');flash.textContent=`−${geng(before)-geng(after)} 更`;flash.style.cssText=`position:absolute;left:${P([cx.x,cx.y])[0]}px;top:${P([cx.x,cx.y])[1]}px;transform:translate(-50%,-50%);font-family:var(--brush);font-size:26px;color:var(--cinnabar);pointer-events:none;transition:transform 1s,opacity 1s`;
  $('nodes').appendChild(flash);requestAnimationFrame(()=>{flash.style.transform='translate(-50%,-160%)';flash.style.opacity=0;});setTimeout(()=>flash.remove(),1100);
  if(LV.stage===2){
    if(left){say(`解开一个结，航程从 ${geng(before)} 更缩到 <b>${geng(after)}</b> 更。还剩 <b>${left}</b> 处交叉。`);return;}
    if(showHidden()){
      if(!LV.sawDark){LV.sawDark=true;say(`明面上的交叉都解开了，航程 <b>${geng(after)}</b> 更。可还有<b>暗结</b>：两段航线虽不交叉，换个接法照样更短。点墨圈试试。`);}
      else say(`又省一段：<b>${geng(after)}</b> 更。`);
      return;}
    const ratio=after/LV.opt.len;
    showResult(grade(ratio),`老航线 <b>${geng(LV.startLen)}</b> 更 → 解结后 <b>${geng(after)}</b> 更　·　最短 <b>${geng(LV.opt.len)}</b> 更`,
      `你只反复做了一件事：拆掉两段航线，换个接法再连上。交叉是最显眼的结，每解一个，航程一定变短（三角形两边之和大于第三边）。`);
    say('这条规矩记下了：<b>航线相交，必有更短</b>。下一程岛多了，要靠它。');
    acts([['下一程 →',()=>setupStage(3),true]]);drawRoute(ratio<1.0005?null:LV.opt.route);
  }
}
function showHidden(){
  const mv=bestImprove(LV.route,LV.pts);if(!mv)return false;const n=LV.route.length,[i,j]=mv;
  const a=LV.pts[LV.route[i]],b=LV.pts[LV.route[i+1]],c=LV.pts[LV.route[j]],e=LV.pts[LV.route[(j+1)%n]];
  const x=(a[0]+b[0]+c[0]+e[0])/4,y=(a[1]+b[1]+c[1]+e[1])/4,q=P([x,y]);
  const k=document.createElement('button');k.className='knot dark';k.style.left=q[0]+'px';k.style.top=q[1]+'px';k.setAttribute('aria-label','解开这个暗结');
  k.onclick=()=>untie({i,j,x,y});$('nodes').appendChild(k);
  // 标出这两段航线
  const cv=$('route').getContext('2d');cv.save();cv.setLineDash([3,5]);cv.strokeStyle='rgba(179,38,30,.55)';cv.lineWidth=5;
  [[a,b],[c,e]].forEach(([u,v])=>{const pu=P(u),pv=P(v);cv.beginPath();cv.moveTo(pu[0],pu[1]);cv.lineTo(pv[0],pv[1]);cv.stroke();});cv.restore();
  return true;
}
function animateRoute(steps,delay,done){LV.busy=true;let i=0;const f=()=>{if(i>=steps.length){LV.busy=false;done&&done();return;}steps[i++]();setTimeout(f,delay);};f();}
function runNearest(){
  if(LV.busy)return;hideResult();clearKnots();LV.mode='tool';LV.closed=false;LV.route=[0];
  const nn=nearest(LV.pts,0),steps=[];
  for(let k=1;k<nn.length;k++)steps.push(()=>{LV.route.push(nn[k]);AU.note(3+(k%9),.14);refreshNodes();drawRoute();});
  steps.push(()=>{LV.closed=true;refreshNodes();drawRoute();});
  say('就近而行：每到一岛，就去离它最近、还没去过的岛。');
  animateRoute(steps,70,()=>{const c=showKnots();const L=lenOf(LV.route,LV.pts,true);
    say(`就近而行得 <b>${geng(L)}</b> 更，又快又不错，但留下了 <b>${c}</b> 处交叉。点「解结」，或者自己点红圈。`);LV.mode='untie3';});
}
function runTwoOpt(){
  if(LV.busy)return;
  if(!LV.closed||LV.route.length<LV.pts.length){if(LV.route.length<=1){runNearest();return;}say('先把航线画完（回到刘家港），再解结。');return;}
  hideResult();clearKnots();const start=lenOf(LV.route,LV.pts,true);LV.busy=true;
  const tick=()=>{const mv=bestImprove(LV.route,LV.pts);if(!mv){LV.busy=false;LV.route=orOpt(LV.route,LV.pts);drawRoute();refreshNodes();finishStage3(lenOf(LV.route,LV.pts,true),start);return;}
    LV.route=twoOptMove(LV.route,mv[0],mv[1]);AU.note(6+Math.floor(Math.random()*5),.12);drawRoute();refreshNodes();setTimeout(tick,110);};
  say('解结：一处处找出能让航程变短的交叉，解开，直到一个也不剩。');tick();
}
function finishStage3(mine,start){
  clearKnots();const opt=LV.opt.len,ratio=mine/opt;
  const pct=Math.max(0,Math.round((ratio-1)*1000)/10);
  showResult(grade(Math.max(1,ratio)),(start?`解结前 <b>${geng(start)}</b> 更 → 解结后 <b>${geng(mine)}</b> 更　·　`:`你的航程 <b>${geng(mine)}</b> 更　·　`)+`已知最好 <b>${geng(opt)}</b> 更`,
    ratio<1.0005?'和长卷反复推演出的最好航线一样短。':`只比已知最好的航线多 ${pct}%，而用时不到一眨眼。`);
  $('sea').classList.add('colored');AU.arp();
  say('岛上着了青绿。这一处妙策参透了。');
  acts([['自己再画',()=>setupStage(3)],['题跋 · 钤印',openColophon,true]]);
}
function openColophon(){const c=$('colo');c.hidden=false;c.classList.remove('stamped');sealCanvas($('sealBig'),'巧解');setTimeout(()=>{c.classList.add('stamped');AU.thud();},500);$('coloBack').focus();}
$('coloBack').onclick=()=>{$('colo').hidden=true;$('level').hidden=true;completeLevel('tsp');};
$('lvClose').onclick=()=>{$('level').hidden=true;};
addEventListener('resize',()=>{if(!$('level').hidden&&LV.pts.length){seaLayout();drawSea();buildNodes();drawRoute();if(LV.mode==='untie'||LV.mode==='untie3'){if(!showKnots()&&LV.stage===2&&$('result').hidden)showHidden();}}});

function completeLevel(id){
  const L=LEVELS.find(l=>l.id===id),first=!doneSet.has(id);doneSet.add(id);persist();updateCount();
  panTo(centerOn(L.x),first?700:10,()=>{
    needColorFor(id);
    const tag=document.querySelector(`.tag[data-id="${id}"]`);
    const grow=()=>{const t0=performance.now();const f=now=>{const k=Math.min(1,(now-t0)/2600);reveal[id]=40+Math.pow(k,.8)*820;applyMasks();if(k<1)requestAnimationFrame(f);else{tag.classList.add('done');AU.thud();}};requestAnimationFrame(f);};
    const wait=()=>{if(tiles.filter(t=>L.x+REACH>t.x0&&L.x-REACH<t.x1).every(t=>t.colDone))grow();else setTimeout(wait,60);};wait();
  });
}

/* ============================================================
   启动
   ============================================================ */
function layout(){computeScale();makeTiles();placeMarks();setOffset(innerWidth-TOTAL*S);
  doneSet.forEach(id=>{reveal[id]=860;needColorFor(id);});
  const vis=visibleRange();tiles.slice().sort((a,b)=>dist(a,vis)-dist(b,vis)).forEach(t=>schedule(t,false));}
let lastH=0;
addEventListener('resize',()=>{clearTimeout(window.__rz);window.__rz=setTimeout(()=>{const s0=S;computeScale();if(Math.abs(S-s0)/s0>.08){const center=(-offset+innerWidth/2)/s0;layout();setOffset(innerWidth/2-center*S);}else{document.documentElement.style.setProperty('--s',s0);S=s0;setOffset(offset);}},200);});
buildScene();
(document.fonts&&document.fonts.ready?Promise.race([document.fonts.ready,new Promise(r=>setTimeout(r,2500))]):Promise.resolve()).then(layout);
</script>
